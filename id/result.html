<script>
// ★重要：アプリのメジャーアップデート時にブラウザの古い・壊れたキャッシュを安全に強制破棄するバージョンロック
const LJ_APP_VERSION = 'v12';
const currentVersion = localStorage.getItem('lj_app_version');
if (currentVersion !== LJ_APP_VERSION) {
  console.log("App upgrade detected. Self-healing database caches but protecting active session inputs...");
  const email = localStorage.getItem('lj_user_email') || localStorage.getItem('email');
  
  // 💥 セッションに入っている貴重な入力データを一時メモリにレスキュー退避！
  const savedInput = sessionStorage.getItem('lj_user_input');
  const backupInput = localStorage.getItem('lj_user_input_backup');
  
  localStorage.clear();
  sessionStorage.clear();
  
  // クリア後にデータを美しく復元
  if (email) localStorage.setItem('lj_user_email', email);
  if (savedInput) sessionStorage.setItem('lj_user_input', savedInput);
  if (backupInput) {
    localStorage.setItem('lj_user_input_backup', backupInput);
    sessionStorage.setItem('lj_user_input', backupInput);
  }
  
  localStorage.setItem('lj_app_version', LJ_APP_VERSION);
  location.reload();
}

if ('serviceWorker' in navigator) {
let refreshing = false;
navigator.serviceWorker.addEventListener('controllerchange', () => {
if (refreshing) return;
refreshing = true;
window.location.reload();
});
}

const JYOTISH_API_URL = "/api/jyotish";
// 決済リンクは訪問者の国の価格帯に応じて /js/checkout-links.js が解決する
const premiumUpgradeUrl = () => window.LJCheckout.linkFor('premium');

document.addEventListener('DOMContentLoaded', async () => {
const contentArea = document.getElementById('content-area');
let savedInput = sessionStorage.getItem('lj_user_input');
if (!savedInput) {
  // ★バックアップからの自動引き継ぎレスキューロジック
  const backupInput = localStorage.getItem('lj_user_input_backup');
  if (backupInput) {
    console.log("[RECOVERY] sessionStorage was lost, but localStorage backup was restored successfully!");
    sessionStorage.setItem('lj_user_input', backupInput);
    savedInput = backupInput;
  }
}
const savedResult = sessionStorage.getItem('lj_diagnosis_result');

// ★自己修復：キャッシュデータ内に未展開 of バグ文字列がないか自動検査して破棄
let isCorrupted = false;
if (savedResult) {
  try {
    if (savedResult.includes('\\${') || savedResult.includes('${')) {
      console.warn("Corrupt diagnosis cache detected. Self-healing by removing...");
      sessionStorage.removeItem('lj_diagnosis_result');
      isCorrupted = true;
    }
  } catch(e) {}
}

// 前日以前のキャッシュは「本日の運勢」として使わず、再取得する
const jstToday = new Date(Date.now() + 9 * 3600 * 1000).toISOString().slice(0, 10);
if (savedResult && !isCorrupted) {
const parsedResult = JSON.parse(savedResult);
if (parsedResult && parsedResult.reading_date === jstToday) {
renderDiagnosis(parsedResult, savedInput ? JSON.parse(savedInput) : null);
return;
}
sessionStorage.removeItem('lj_diagnosis_result');
}

if (savedInput) {
const payload = JSON.parse(savedInput);

// 鑑定生成は数十秒かかるため、進行状況を順に見せて無反応に見えないようにする
const progressSteps = [
  'Memecahkan posisi kosmis (zodiak bulan Anda)...',
  'Menghitung koordinat tempat lahir dan peta kelahiran Anda...',
  'Mengambil transit hari ini...',
  'Menyusun pembacaan pribadi Anda...'
];
let progressIndex = 0;
const progressTimer = setInterval(() => {
  progressIndex = Math.min(progressIndex + 1, progressSteps.length - 1);
  const titleElem = document.getElementById('loading-title');
  if (titleElem) titleElem.textContent = progressSteps[progressIndex];
}, 9000);

// ブラウザが無限に待たないよう自分で打ち切り、再試行を案内する
const abortController = new AbortController();
const clientTimeout = setTimeout(() => abortController.abort(), 90000);

try {
const response = await fetch(JYOTISH_API_URL, {
method: 'POST',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify(payload),
signal: abortController.signal
});

if (!response.ok) {
  let errMsg = `HTTP error! status: ${response.status}`;
  try {
    const errJson = await response.json();
    if (errJson && errJson.error) errMsg = errJson.error;
  } catch(e) {}
  throw new Error(errMsg);
}

const data = await response.json();
sessionStorage.setItem('lj_diagnosis_result', JSON.stringify(data));

// ★マイページでの即時表示・データ引継ぎのために jyotish_user キャッシュを保存
try {
const userData = {
email: payload.email,
dob: payload.dob,
tob: payload.tob,
city: payload.city || payload.address,
language: payload.language || 'id',
status: data.status || 'free',
lastResult: data
};
localStorage.setItem('jyotish_user', JSON.stringify(userData));
localStorage.setItem('lj_user_email', payload.email);
} catch (e) {
console.error("Failed to save jyotish_user:", e);
}

renderDiagnosis(data, payload);
} catch (err) {
console.error("Kesalahan koneksi: ", err);
const timedOut = err && err.name === 'AbortError';
contentArea.innerHTML = `
<div style="text-align:center; padding:20px;">
<p style="color:#c0392b; font-weight:bold; font-size:1.05rem;">${timedOut ? 'Penyusunan pembacaan Anda memakan waktu lebih lama dari biasanya.' : 'Kami tidak dapat memperoleh data pembacaan Anda.'}</p>
<p style="font-size:0.85rem; color:#5A4E48; margin-top:8px;">${timedOut ? 'Perhitungan astrologi eksternal atau pembuatan teks oleh AI mungkin sedang padat. Biasanya berhasil bila dicoba lagi.' : 'Mohon maaf — silakan coba lagi sebentar lagi.'}</p>
<button id="retry-diagnosis" class="btn-primary" style="margin-top:15px; padding:12px 24px; border:none; border-radius:8px; font-weight:600; cursor:pointer;">Coba lagi</button>
<div><a href="/id" class="btn-secondary" style="margin-top:12px; display:inline-block;">Kembali ke layar pengisian</a></div>
</div>
`;
const retryBtn = document.getElementById('retry-diagnosis');
if (retryBtn) retryBtn.addEventListener('click', () => location.reload());
} finally {
clearInterval(progressTimer);
clearTimeout(clientTimeout);
}
} else {
  // ★強制送還をブロックして、画面上に丁寧な再入力を促すUIを自動描画！
  console.error("[CRITICAL] Birth data input not found in sessionStorage or backup.");
  contentArea.innerHTML = `
    <div style="text-align:center; padding:30px 10px;">
      <div style="font-size:2.5rem; margin-bottom:15px;">🔍💎</div>
      <p style="color:#c0392b; font-weight:bold; font-size:1.1rem; margin-bottom:10px;">Kami tidak dapat membaca data kelahiran Anda</p>
      <p style="font-size:0.85rem; color:#5A4E48; line-height:1.6; margin-bottom:20px;">
        Pengaturan keamanan peramban, mode penyamaran, atau pembersihan cache mungkin telah menghapus data sementara yang Anda masukkan.
      </p>
      <a href="/id" class="btn-primary" style="display:inline-block; text-decoration:none; padding:12px 24px; font-weight:600; border-radius:8px; width:auto; max-width:260px;">Masukkan kembali data Anda dari halaman utama</a>
    </div>
  `;
}
});

function renderDiagnosis(result, input) {
let readingContent = result.reading || result.result || JSON.stringify(result);

// ★【拡張ロジック】新簡易鑑定の4大要素（free_reading）が返ってきた場合に綺麗にカードレイアウト化
if (result.free_reading) {
const fr = result.free_reading;
readingContent = `
<h2>Pembacaan mistis yang menuntun Anda</h2>

<div style="margin-bottom:20px; border-bottom:1px dashed rgba(139,107,27,0.25); padding-bottom:12px;">
<p style="font-weight:bold; color:var(--color-gold-dark); margin-bottom:4px;">Zodiak Matahari Anda</p>
<p style="font-size:1.15rem; font-weight:700; color:var(--color-text-dark); margin-left:8px;">${result.sunSign || '-'}</p>
</div>

<div style="margin-bottom:20px; border-bottom:1px dashed rgba(139,107,27,0.25); padding-bottom:12px;">
<p style="font-weight:bold; color:var(--color-gold-dark); margin-bottom:4px;">Zodiak Bulan Anda</p>
<p style="font-size:1.15rem; font-weight:700; color:var(--color-text-dark); margin-left:8px;">${result.moonSign || '-'}</p>
</div>

<div style="margin-bottom:20px; border-bottom:1px dashed rgba(139,107,27,0.25); padding-bottom:12px;">
<p style="font-weight:bold; color:var(--color-gold-dark); margin-bottom:4px;">Nakshatra</p>
<p style="font-size:1.15rem; font-weight:700; color:var(--color-text-dark); margin-left:8px;">${result.nakshatra || '-'}</p>
</div>

<div style="margin-bottom:24px;">
<p style="font-weight:bold; color:var(--color-gold-dark); margin-bottom:6px;">① Horoskop hari ini</p>
<p style="color:#4a3e36; line-height:1.7; text-align:justify; margin-left:8px;">${fr.horoscope || '-'}</p>
</div>

<div style="margin-bottom:24px;">
<p style="font-weight:bold; color:var(--color-gold-dark); margin-bottom:6px;">② Pengaruh bintang</p>
<p style="color:#4a3e36; line-height:1.7; text-align:justify; margin-left:8px;">${fr.influence || '-'}</p>
</div>

<div style="margin-bottom:24px;">
<p style="font-weight:bold; color:var(--color-gold-dark); margin-bottom:6px;">③ Panduan Mahadasha saat ini</p>
<p style="color:#4a3e36; line-height:1.7; text-align:justify; margin-left:8px;">${fr.dasha_summary || '-'}</p>
</div>

<div style="margin-top:25px; padding:15px; background:rgba(139,107,27,0.06); border:1px dashed var(--color-gold-main); border-radius:8px; text-align:center; font-weight:bold; color:var(--color-gold-dark);">
④ ${fr.lucky_element || '✨ Tema keberuntungan hari ini: keheningan dan perenungan mendalam'}
</div>
`;
}

document.getElementById('content-area').innerHTML = `
${input ? `<div class="meta-card">✉️ Email: ${input.email || 'Tidak diisi'}<br>📅 Tanggal lahir: ${input.dob} ${input.tob || ''} | 📍 Tempat lahir: ${input.address || input.city}</div>` : ''}
<div class="result-body">${readingContent}</div>
${result.geo_notice ? `<p style="margin:12px 4px 0; font-size:0.78rem; color:#6b5b4a; line-height:1.6;">${result.geo_notice}</p>` : ''}
${result.status === 'paid' ? '' : buildLockedPreview()}
<div class="cta-card">
<h3 style="color:var(--color-gold-dark); margin-bottom:8px;">✨ Lihat posisi seluruh planet di halaman anggota Anda</h3>
<p style="font-size:0.85rem; color:#5A4E48; margin-bottom:15px;">Di halaman anggota, Anda dapat melihat peta Anda dan gambaran hari ini kapan saja.</p>
<a href="/id/mypage" class="btn-primary">Buka halaman anggota saya</a>
</div>
`;

window.LJCheckout.paint();

const upgradeBtn = document.getElementById('btn-upgrade-preview');
if (upgradeBtn) {
upgradeBtn.addEventListener('click', () => {
const email = (input && input.email) || localStorage.getItem('lj_user_email') || '';
window.open(`${premiumUpgradeUrl()}?prefilled_email=${encodeURIComponent(email)}`, '_blank');
});
}
}

// 無料鑑定との差が伝わるよう、有料会員に開放される項目をサンプル表示＋ぼかしで見せる
function buildLockedPreview() {
return `
