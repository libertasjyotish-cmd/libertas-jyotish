<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>詳細鑑定PDFのご案内 | Libertas Jyotish</title>
  <!-- カノニカルURL設定（Google審査・SEOリダイレクトエラー対策） -->
  <link rel="canonical" href="https://libertas-jyotish.com/ja/pdf-purchase.html">
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#0c1a1f">
  <link rel="icon" type="image/png" href="../img/libertas-logo.png">
  <link rel="apple-touch-icon" href="../img/libertas-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Noto+Serif+JP:wght@300;400;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --color-gold-light: #FDE047;
      --color-gold-main: #D4AF37;
      --color-gold-dark: #8B6B1B;
      --color-text-dark: #2C221E;
      --font-en: 'Cinzel', serif;
      --font-ja: 'Noto Serif JP', serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-ja);
      color: var(--color-text-dark);
      line-height: 1.8;
      min-height: 100vh;
      overflow-x: hidden;
      background-color: #0c1a1f;
      display: flex; flex-direction: column;
    }

    .site-header {
      position: fixed; top: 0; left: 0; width: 100%; z-index: 100;
      background: rgba(12, 26, 31, 0.92);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(139, 107, 27, 0.3);
      padding: 12px 20px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .header-logo {
      display: flex; align-items: center; gap: 10px;
      text-decoration: none; color: var(--color-gold-main);
      font-family: var(--font-en); font-weight: 600; font-size: 1.05rem;
    }
    .header-logo img { width: 32px; height: 32px; }
    .header-nav { display: flex; gap: 18px; align-items: center; }
    .header-nav a { color: #E2D9CE; text-decoration: none; font-size: 0.82rem; transition: color 0.3s; }
    .header-nav a:hover { color: var(--color-gold-main); }

    .main-section {
      position: relative; flex: 1;
      display: flex; align-items: center; justify-content: center;
      padding: 100px 20px 60px;
      background-image: linear-gradient(rgba(12, 26, 31, 0.45), rgba(12, 26, 31, 0.45)), url("../img/bg-jyotish.jpg");
      background-size: cover; background-position: center; background-attachment: fixed;
    }

    .card-container {
      position: relative; z-index: 2; width: 100%; max-width: 680px;
      background-image: 
        radial-gradient(circle at 50% 25%, rgba(255, 253, 245, 0.98) 0%, rgba(245, 233, 208, 0.95) 55%, rgba(220, 200, 162, 0.96) 100%),
        linear-gradient(135deg, rgba(255, 255, 255, 0.4) 0%, rgba(0, 0, 0, 0.05) 100%);
      background-blend-mode: overlay, normal;
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      border-radius: 14px;
      border: 1px solid rgba(184, 142, 60, 0.65);
      outline: 1px solid rgba(212, 175, 55, 0.35); outline-offset: -7px;
      box-shadow: 
        0 25px 50px -12px rgba(0, 0, 0, 0.75),
        0 0 20px rgba(212, 175, 55, 0.18),
        inset 0 0 35px rgba(139, 90, 43, 0.28),
        inset 0 2px 4px rgba(255, 255, 255, 0.8);
      padding: 45px 35px 40px; text-align: center; margin-bottom: 30px;
    }

    .data-confirm-box {
      background: rgba(255, 252, 245, 0.85);
      border: 1px solid rgba(139, 107, 27, 0.35); border-radius: 10px;
      padding: 22px; margin-bottom: 25px; text-align: left;
      box-shadow: inset 0 2px 4px rgba(112, 76, 32, 0.12);
    }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 0.82rem; font-weight: 600; color: var(--color-text-dark); margin-bottom: 6px; }
    
    input[type="email"], input[type="text"], input[type="datetime-local"] {
      width: 100%; padding: 11px 14px;
      background-color: rgba(255, 252, 245, 0.85);
      border: 1px solid rgba(139, 107, 27, 0.4); border-radius: 8px;
      font-family: inherit; font-size: 0.9rem; color: var(--color-text-dark); outline: none; transition: all 0.3s ease;
      box-shadow: inset 0 2px 4px rgba(112, 76, 32, 0.12);
    }
    input:focus {
      border-color: var(--color-gold-dark);
      box-shadow: inset 0 2px 4px rgba(112, 76, 32, 0.15), 0 0 8px rgba(212, 175, 55, 0.3);
      background-color: #FFFDF9;
    }

    .btn-purchase {
      width: 100%; padding: 15px 28px; font-size: 1.05rem; font-weight: 600; font-family: var(--font-ja); color: #FFFDF9;
      background: linear-gradient(135deg, #C59B27 0%, var(--color-gold-dark) 100%); border: none; border-radius: 8px; cursor: pointer;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35), inset 0 1px 1px rgba(255, 255, 255, 0.4); transition: transform 0.2s;
    }
    .btn-purchase:hover { transform: translateY(-1px); }

    .report-card {
      background: rgba(255, 252, 245, 0.85);
      border: 1px solid rgba(139, 107, 27, 0.35); border-radius: 10px;
      padding: 22px; margin-bottom: 20px; text-align: left;
      box-shadow: inset 0 2px 4px rgba(112, 76, 32, 0.12);
    }
    .report-card h3 { font-size: 1.05rem; color: var(--color-gold-dark); margin-bottom: 10px; border-bottom: 1px solid rgba(139, 107, 27, 0.2); padding-bottom: 5px; }
    
    .kundali-img-wrapper { text-align: center; padding: 12px; background: #FFFDF9; border: 1px solid rgba(139, 107, 27, 0.3); border-radius: 8px; margin-bottom: 15px; }
    .kundali-img-wrapper img { max-width: 100%; height: auto; max-height: 280px; }

    .timeline-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; margin-top: 8px; }
    .timeline-table th, .timeline-table td { padding: 8px 10px; border: 1px solid rgba(139, 107, 27, 0.3); text-align: left; }
    .timeline-table th { background: rgba(212, 175, 55, 0.15); color: var(--color-gold-dark); font-weight: 600; }

    .site-footer { width: 100%; background: rgba(8, 18, 22, 0.95); border-top: 1px solid rgba(139, 107, 27, 0.3); padding: 24px 20px; text-align: center; position: relative; z-index: 10; }
    .footer-links a { color: var(--color-gold-main); text-decoration: none; font-size: 0.82rem; }
    .copyright { font-size: 0.75rem; color: #8A9A9E; font-family: var(--font-en); margin-top: 8px; }

    @media print {
      .site-header, .site-footer, .btn-purchase, #btn-print-pdf { display: none !important; }
      body { background: #ffffff !important; color: #000000 !important; }
      .main-section { padding: 0 !important; background: none !important; }
      .card-container { max-width: 100% !important; box-shadow: none !important; border: none !important; outline: none !important; background: #ffffff !important; padding: 0 !important; }
      .report-card { background: #ffffff !important; border: 1px solid #ccc !important; page-break-inside: avoid; }
    }
  </style>
</head>
<body>

  <header class="site-header">
    <a href="./index.html" class="header-logo"><img src="../img/libertas-logo.png" alt="Logo"><span>Libertas Jyotish</span></a>
    <nav class="header-nav">
      <a href="./index.html">トップ</a>
      <a href="./result.html">無料診断</a>
      <a href="./mypage.html">マイページ</a>
      <a href="./pdf-purchase.html" style="color:var(--color-gold-main);">完全鑑定書</a>
    </nav>
  </header>

  <section class="main-section">
    <div class="card-container">
      
      <div id="purchase-form-view">
        <h1 style="font-size:1.5rem; color:var(--color-text-dark); margin-bottom:12px;">あなただけの完全鑑定書（PDF）</h1>
        <p style="font-size:0.88rem; color:#5A4E48; margin-bottom:25px;">人生のテーマ、ダシャー周期、開運アドバイスを1冊の特別レポートにまとめてお届けします。</p>

        <div class="data-confirm-box">
          <div class="form-group"><label for="user-email">メールアドレス</label><input type="email" id="user-email" required></div>
          <div class="form-group"><label for="user-birthdate">生年月日・時間</label><input type="datetime-local" id="user-birthdate" required></div>
          <div class="form-group"><label for="user-birthplace">出生地</label><input type="text" id="user-birthplace" placeholder="例: 東京都世田谷区" required></div>
        </div>

        <div style="font-size:1.3rem; font-weight:700; color:var(--color-gold-dark); margin-bottom:15px;">買い切り 3,300円（税込）</div>
        <button id="btn-proceed-checkout" class="btn-purchase">💳 決済に進む（Stripe）</button>
      </div>

      <div id="pdf-report-view" style="display: none;">
        <h1 style="font-size:1.4rem; color:var(--color-gold-dark); margin-bottom:6px;">✦ Libertas Jyotish 完全鑑定書 ✦</h1>
        <p style="font-size:0.82rem; color:#6A5E58; margin-bottom:20px;" id="report-owner-info">鑑定対象者様データ</p>

        <div class="report-card">
          <h3>出生図（クンダリー・チャート）</h3>
          <div class="kundali-img-wrapper">
            <img id="kundali-chart-img" src="" alt="クンダリーチャート">
          </div>
          <p id="chart-summary-text" style="font-size:0.85rem; color:#4a3e36;"></p>
        </div>

        <div class="report-card">
          <h3>人生のタイムライン（ダシャー全周期）</h3>
          <div style="overflow-x: auto;">
            <table class="timeline-table">
              <thead>
                <tr>
                  <th>惑星期</th>
                  <th>期間</th>
                  <th>主な人生のテーマ</th>
                </tr>
              </thead>
              <tbody id="dasha-timeline-body">
              </tbody>
            </table>
          </div>
        </div>

        <div class="report-card">
          <h3>開運レメディ & 処方せん</h3>
          <div id="remedy-content" style="font-size:0.88rem; color:#4a3e36;">
          </div>
        </div>

        <button id="btn-print-pdf" class="btn-purchase" style="margin-top:15px; background: linear-gradient(135deg, #2C5282 0%, #1A365D 100%);">📄 PDFとして保存・印刷する</button>
      </div>

    </div>
  </section>

  <footer class="site-footer">
    <div class="footer-links"><a href="./legal.html">特定商取引法に基づく表記・利用規約・プライバシーポリシー</a></div>
    <p class="copyright">&copy; Libertas Jyotish All Rights Reserved.</p>
  </footer>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const savedEmail = localStorage.getItem('lj_user_email') || '';
      const savedBirthdate = localStorage.getItem('lj_user_birthdate') || '';
      const savedBirthplace = localStorage.getItem('lj_user_birthplace') || '';

      if (savedEmail) document.getElementById('user-email').value = savedEmail;
      if (savedBirthdate) document.getElementById('user-birthdate').value = savedBirthdate;
      if (savedBirthplace) document.getElementById('user-birthplace').value = savedBirthplace;

      const urlParams = new URLSearchParams(window.location.search);
      const isPaidSuccess = urlParams.get('status') === 'success' || urlParams.get('paid') === 'true' || localStorage.getItem('lj_pdf_purchased') === 'true';

      if (isPaidSuccess) {
        document.getElementById('purchase-form-view').style.display = 'none';
        document.getElementById('pdf-report-view').style.display = 'block';
        loadReportData();
      }

      document.getElementById('btn-proceed-checkout').addEventListener('click', () => {
        const email = document.getElementById('user-email').value;
        const birthdate = document.getElementById('user-birthdate').value;
        const birthplace = document.getElementById('user-birthplace').value;

        if (!email) { alert('メールアドレスを入力してください。'); return; }
        if (!birthdate) { alert('生年月日・時間を入力してください。'); return; }
        if (!birthplace) { alert('出生地を入力してください。'); return; }

        localStorage.setItem('lj_user_email', email);
        localStorage.setItem('lj_user_birthdate', birthdate);
        localStorage.setItem('lj_user_birthplace', birthplace);

        const domain = window.location.origin;
        // 将来的にPDF購入のStripe決済リンクができましたら、ここをそのリンクに差し替えることで完全連携が可能です！
        // ※下記は今回のサブスク商品のStripe決済リンクをプレースホルダー（サンプル）として差し込んでいます。
        const stripePdfUrl = `https://buy.stripe.com/dRmaEZ0I73Bx6g8auH24000?prefilled_email=${encodeURIComponent(email)}`;
        window.location.href = stripePdfUrl;
      });

      document.getElementById('btn-print-pdf').addEventListener('click', () => {
        window.print();
      });
    });

    function loadReportData() {
      const email = localStorage.getItem('lj_user_email') || 'ゲスト様';
      const birthplace = localStorage.getItem('lj_user_birthplace') || '未設定';
      document.getElementById('report-owner-info').textContent = `登録メール: ${email} | 出生地: ${birthplace}`;

      let userData = JSON.parse(localStorage.getItem('lj_user_chart_data'));
      
      if (!userData) {
        document.getElementById('chart-summary-text').textContent = '⚠️ 鑑定データが見つかりません。TOPページから診断を行ってください。';
        return;
      }

      if (userData.kundaliChartUrl) {
        document.getElementById('kundali-chart-img').src = userData.kundaliChartUrl;
      }
      if (userData.summary) {
        document.getElementById('chart-summary-text').textContent = userData.summary;
      }

      if (userData.dashaTimeline && Array.isArray(userData.dashaTimeline)) {
        const tbody = document.getElementById('dasha-timeline-body');
        tbody.innerHTML = '';
        userData.dashaTimeline.forEach(d => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td style="font-weight:600;">${d.planet}期</td>
            <td>${d.period}</td>
            <td>${d.theme}</td>
          `;
          tbody.appendChild(tr);
        });
      }

      if (userData.remedies) {
        const remedyBox = document.getElementById('remedy-content');
        remedyBox.innerHTML = `
          <p><strong>🎨 ラッキーカラー：</strong> ${userData.remedies.color || '-'}</p>
          <p style="margin-top:4px;"><strong>💎 開運宝石/マントラ：</strong> ${userData.remedies.gem || '-'}</p>
          <p style="margin-top:6px;"><strong>✨ 意識すべきアクション：</strong> ${userData.remedies.action || '-'}</p>
        `;
      }
    }
  </script>
</body>
</html>
