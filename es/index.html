<!DOCTYPE html>
<html lang="es" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Libertas Jyotish - Próximamente</title>
<meta name="description" content="Libertas Jyotish, portal de astrología védica, prepara su edición en español.">
<meta name="robots" content="noindex">
<link rel="canonical" href="https://libertas-jyotish.com/es">
<link rel="icon" type="image/png" href="/img/libertas-logo.png">
<link rel="apple-touch-icon" href="/img/libertas-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Noto+Serif:wght@300;400;600&family=Noto+Naskh+Arabic:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
--color-gold-light: #FDE047;
--color-gold-main: #D4AF37;
--color-gold-dark: #8B6B1B;
--color-text-dark: #2C221E;
--font-en: 'Cinzel', serif;
--font-body: 'Noto Serif', Georgia, serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
font-family: var(--font-body);
color: var(--color-text-dark);
line-height: 1.8;
min-height: 100vh;
background-color: #0c1a1f;
display: flex; flex-direction: column;
}
.hero-section {
flex: 1; display: flex; align-items: center; justify-content: center;
padding: 80px 20px 60px;
background-image: linear-gradient(rgba(12, 26, 31, 0.45), rgba(12, 26, 31, 0.45)), url("/img/bg-jyotish.jpg");
background-size: cover; background-position: center center; background-repeat: no-repeat; background-attachment: fixed;
}
.hero-container {
width: 100%; max-width: 560px; text-align: center;
background-image:
radial-gradient(circle at 50% 25%, rgba(255, 253, 245, 0.98) 0%, rgba(245, 233, 208, 0.95) 55%, rgba(220, 200, 162, 0.96) 100%),
linear-gradient(135deg, rgba(255, 255, 255, 0.4) 0%, rgba(0, 0, 0, 0.05) 100%);
border-radius: 14px;
border: 1px solid rgba(184, 142, 60, 0.65);
outline: 1px solid rgba(212, 175, 55, 0.35); outline-offset: -7px;
box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.75), inset 0 0 35px rgba(139, 90, 43, 0.28);
padding: 45px 32px 38px;
}
.logo-img { width: 92px; height: auto; margin-bottom: 14px; filter: drop-shadow(0px 3px 6px rgba(139, 107, 27, 0.35)); }
.brand { font-family: var(--font-en); font-size: 1.25rem; letter-spacing: 0.12em; color: var(--color-gold-dark); margin-bottom: 18px; }
.badge {
display: inline-block; font-family: var(--font-en); font-size: 0.78rem; letter-spacing: 0.22em;
color: var(--color-gold-dark); border: 1px solid rgba(139, 107, 27, 0.4); background: rgba(212, 175, 55, 0.12);
padding: 4px 16px; border-radius: 50px; margin-bottom: 18px; text-transform: uppercase;
}
h1 { font-size: 1.2rem; font-weight: 600; line-height: 1.6; margin-bottom: 12px; }
p.lead { font-size: 0.92rem; color: #5A4E48; margin-bottom: 24px; }
.btn-ja {
display: inline-block; text-decoration: none; font-size: 0.85rem;
color: #2C221E; background: linear-gradient(135deg, var(--color-gold-light), var(--color-gold-main));
border-radius: 6px; padding: 10px 22px; font-weight: 600;
}
.site-footer {
width: 100%; background: rgba(8, 18, 22, 0.95); border-top: 1px solid rgba(139, 107, 27, 0.3);
padding: 24px 20px; text-align: center;
}
.lang-switch { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; margin-bottom: 12px; }
.lang-link {
display: inline-flex; align-items: center; gap: 6px; text-decoration: none;
color: #E2D9CE; font-size: 0.78rem; letter-spacing: 0.06em;
border: 1px solid rgba(139, 107, 27, 0.35); border-radius: 50px; padding: 4px 12px;
transition: color 0.3s, border-color 0.3s;
}
.lang-link:hover { color: var(--color-gold-main); border-color: var(--color-gold-main); }
.lang-link.is-current { color: var(--color-gold-main); border-color: var(--color-gold-main); background: rgba(212, 175, 55, 0.12); }
.lang-flag { font-size: 1rem; line-height: 1; }
.copyright { font-size: 0.75rem; color: #8A9A9E; font-family: var(--font-en); }
</style>
</head>
<body>

<section class="hero-section">
<div class="hero-container">
<img class="logo-img" src="/img/libertas-logo.png" alt="Libertas Jyotish">
<div class="brand">LIBERTAS JYOTISH</div>
<span class="badge">Próximamente</span>
<h1>La edición en español está en construcción.</h1>
<p class="lead">Estamos preparando lecturas basadas en la astrología sideral (védica). Vuelve pronto.</p>
<a class="btn-ja" href="/ja" hreflang="ja">Ir al sitio en japonés</a>
</div>
</section>

<footer class="site-footer">
<nav class="lang-switch" aria-label="Language">
<a class="lang-link" href="/ja" hreflang="ja" lang="ja" title="日本語" aria-label="日本語"><span class="lang-flag">🇯🇵</span><span class="lang-code">JA</span></a>
<a class="lang-link" href="/en" hreflang="en" lang="en" title="English" aria-label="English"><span class="lang-flag">🇬🇧</span><span class="lang-code">EN</span></a>
<a class="lang-link is-current" href="/es" hreflang="es" lang="es" title="Español" aria-label="Español"><span class="lang-flag">🇪🇸</span><span class="lang-code">ES</span></a>
<a class="lang-link" href="/pt" hreflang="pt" lang="pt" title="Português" aria-label="Português"><span class="lang-flag">🇵🇹</span><span class="lang-code">PT</span></a>
<a class="lang-link" href="/ar" hreflang="ar" lang="ar" title="العربية" aria-label="العربية"><span class="lang-flag">🇸🇦</span><span class="lang-code">AR</span></a>
<a class="lang-link" href="/id" hreflang="id" lang="id" title="Bahasa Indonesia" aria-label="Bahasa Indonesia"><span class="lang-flag">🇮🇩</span><span class="lang-code">ID</span></a>
</nav>
<p class="copyright">&copy; Libertas Jyotish All Rights Reserved.</p>
</footer>

</body>
</html>
