<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Libertas Jyotish</title>
  <link rel="canonical" href="https://libertas-jyotish.com/">
  <link rel="icon" type="image/png" href="/img/libertas-logo.png">
  <link rel="apple-touch-icon" href="/img/libertas-logo.png">
  <meta name="description" content="Libertas Jyotish - Astro-Intelligence Platform">
  <script>
    (function() {
      // ユーザーのブラウザ言語を取得
      const userLang = (navigator.language || navigator.userLanguage || 'ja').toLowerCase();
      
      // 公開済みの言語ディレクトリのみを列挙する。
      // 新しい言語（/en/, /es/, /pt/, /ar/, /id/）を公開したらここに追加すれば自動判定に載る。
      const availableLangs = ['ja'];

      let targetLang = 'ja'; // 未対応言語のフォールバックは日本語
      for (const lang of availableLangs) {
        if (userLang.startsWith(lang)) {
          targetLang = lang;
          break;
        }
      }

      // 言語ディレクトリへ即時リダイレクト（cleanUrls のため拡張子なし）
      window.location.replace('/' + targetLang);
    })();
  </script>
</head>
<body>
  <p style="text-align: center; margin-top: 50px; font-family: sans-serif; color: #8B6B1B;">
    Redirecting to your language library... / ページを移動しています...
  </p>
</body>
</html>
