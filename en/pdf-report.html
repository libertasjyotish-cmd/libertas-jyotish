<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lifetime Report | Libertas Jyotish</title>
  <link rel="canonical" href="https://www.libertas-jyotish.com/en/pdf-report">
  <meta name="robots" content="noindex">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0c1a1f">
  <link rel="icon" type="image/png" href="/img/libertas-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Noto+Serif:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    /* 背景画像はここだけを差し替えれば全ページに反映される */
    :root {
      --cover-bg: url("/img/report-cover.jpg");
      --chapter-bg: url("/img/report-cover.jpg");
      --chapter-bg-opacity: 0.07;
      --logo: url("/img/libertas-logo.png");
      --color-gold-main: #D4AF37;
      --color-gold-dark: #8B6B1B;
      --color-ink: #2C221E;
      --color-paper: #FFFDF7;
      --font-en: 'Cinzel', serif;
      --font-ja: 'Noto Serif', serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-ja); color: var(--color-ink); line-height: 1.9;
      background: #0c1a1f;
    }
    .toolbar {
      position: fixed; top: 0; left: 0; width: 100%; z-index: 100;
      background: rgba(12, 26, 31, 0.94); border-bottom: 1px solid rgba(139, 107, 27, 0.3);
      padding: 10px 18px; display: flex; justify-content: space-between; align-items: center;
    }
    .toolbar a { color: #E2D9CE; text-decoration: none; font-size: 0.82rem; }
    .toolbar .brand { color: var(--color-gold-main); font-family: var(--font-en); }
    .btn {
      padding: 9px 18px; font-family: var(--font-ja); font-size: 0.85rem; color: #FFFDF9; cursor: pointer;
      background: linear-gradient(135deg, #C59B27 0%, var(--color-gold-dark) 100%);
      border: none; border-radius: 6px;
    }

    .book { max-width: 820px; margin: 0 auto; padding: 70px 0 60px; }
    .page {
      position: relative; background: var(--color-paper); padding: 46px 46px 52px; margin-bottom: 22px;
      border: 1px solid rgba(184, 142, 60, 0.5); border-radius: 6px;
      box-shadow: 0 18px 40px -18px rgba(0, 0, 0, 0.7);
    }
    /* 章扉の背景は薄く敷き、本文の可読性を落とさない */
    .page::before {
      content: ''; position: absolute; inset: 0; border-radius: 6px; pointer-events: none;
      background-image: var(--chapter-bg); background-size: cover; background-position: center;
      opacity: var(--chapter-bg-opacity);
    }
    .page > * { position: relative; }

    .cover {
      min-height: 1000px; text-align: center; color: #3a2f14;
      background-image: linear-gradient(rgba(255, 253, 247, 0.35), rgba(255, 253, 247, 0.55)), var(--cover-bg);
      background-size: cover; background-position: center;
      display: flex; flex-direction: column; justify-content: space-between;
    }
    .cover::before { content: none; }
    .cover .logo { width: 68px; margin: 0 auto; }
    .cover h1 { font-family: var(--font-en); font-size: 2.1rem; letter-spacing: 0.14em; color: var(--color-gold-dark); }
    .cover .sub { font-size: 1.15rem; letter-spacing: 0.3em; margin-top: 10px; }
    .cover .owner { font-size: 0.95rem; line-height: 2.2; }

    h2.chapter-title {
      font-size: 1.35rem; color: var(--color-gold-dark); letter-spacing: 0.06em;
      border-bottom: 1px solid rgba(139, 107, 27, 0.35); padding-bottom: 10px; margin-bottom: 22px;
    }
    h3 { font-size: 1rem; color: var(--color-gold-dark); margin: 22px 0 8px; }
    p { font-size: 0.94rem; margin-bottom: 12px; text-align: justify; }
    ul { margin: 6px 0 12px 1.2em; font-size: 0.94rem; }

    .lead { font-size: 1.5rem; line-height: 1.7; color: var(--color-gold-dark); text-align: center; margin: 10px 0 26px; }
    .toc li { margin-bottom: 6px; }

    .fact {
      background: rgba(212, 175, 55, 0.09); border-left: 3px solid var(--color-gold-main);
      padding: 12px 16px; margin: 14px 0; font-size: 0.9rem;
    }
    .fact .reason { display: block; font-size: 0.8rem; color: #6A5E58; margin-top: 4px; }

    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; margin: 12px 0; }
    th, td { border: 1px solid rgba(139, 107, 27, 0.3); padding: 7px 9px; text-align: left; }
    th { background: rgba(212, 175, 55, 0.14); color: var(--color-gold-dark); font-weight: 600; }

    .bar-row { display: grid; grid-template-columns: 7em 1fr 3.4em; align-items: center; gap: 10px; margin-bottom: 6px; font-size: 0.85rem; }
    .bar { height: 12px; background: rgba(139, 107, 27, 0.15); border-radius: 6px; overflow: hidden; }
    .bar span { display: block; height: 100%; background: linear-gradient(90deg, #D4AF37, #8B6B1B); }

    .chart-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .chart-box { border: 1px solid rgba(139, 107, 27, 0.3); background: #fff; padding: 10px; text-align: center; }
    .chart-box svg, .chart-box img { max-width: 100%; height: auto; }
    .chart-box figcaption { font-size: 0.8rem; color: #6A5E58; margin-top: 6px; }

    .color-chip { display: inline-block; width: 16px; height: 16px; border-radius: 3px; border: 1px solid rgba(0,0,0,0.2); vertical-align: -3px; margin-right: 6px; }
    .disclaimer { font-size: 0.78rem; color: #6A5E58; line-height: 1.9; }

    .status { color: #E2D9CE; text-align: center; padding: 140px 24px; font-size: 0.95rem; }
    .status a { color: var(--color-gold-main); }

    @media (max-width: 640px) {
      .page { padding: 26px 20px 32px; }
      .chart-grid { grid-template-columns: 1fr; }
    }

    @media print {
      @page { size: A4; margin: 14mm; }
      body { background: #fff; }
      .toolbar, .status { display: none !important; }
      .book { max-width: 100%; padding: 0; }
      .page {
        margin: 0; border: none; border-radius: 0; box-shadow: none; padding: 0 0 12mm;
        page-break-after: always; break-after: page;
      }
      .page:last-child { page-break-after: auto; break-after: auto; }
      .cover { min-height: 245mm; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .fact, .bar-row, table, .chart-box { page-break-inside: avoid; break-inside: avoid; }
      h2.chapter-title, h3 { page-break-after: avoid; break-after: avoid; }
      * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
  </style>
  <link rel="stylesheet" href="/css/rtl.css">
</head>
<body>

  <div class="toolbar">
    <a href="/en" class="brand">Libertas Jyotish</a>
    <div>
      <span id="progress" style="color:#E2D9CE; font-size:0.78rem; margin-right:16px;"></span>
      <a href="/en/mypage" style="margin-right:16px;">Member page</a>
      <button class="btn" id="btn-print">Save or print as PDF</button>
    </div>
  </div>

  <div id="status" class="status">Loading your report...</div>
  <div class="book" id="book" style="display:none;"></div>

  <script>
    const API_URL = '/api/pdf-report';
    const statusEl = document.getElementById('status');
    const bookEl = document.getElementById('book');

    const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, (c) => (
      { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
    ));
    const para = (text) => (text ? String(text).split(/\n{1,}/).map((t) => `<p>${esc(t)}</p>`).join('') : '');
    const page = (inner) => `<section class="page">${inner}</section>`;

    document.getElementById('btn-print').addEventListener('click', () => window.print());

    function setStatus(html) {
      statusEl.innerHTML = html;
      statusEl.style.display = 'block';
    }

    async function requestReport(email, session) {
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email,
          session,
          dob: localStorage.getItem('dob') || '',
          tob: localStorage.getItem('tob') || '',
          city: localStorage.getItem('city') || '',
          language: 'en'
        })
      });

      if (res.status === 401) {
        localStorage.removeItem('lj_session');
        throw new Error('Your session has expired.<br><a href=\"/en/mypage?next=pdf-report\">Sign in again to open your report</a>');
      }
      if (res.status === 403) throw new Error('This report is for purchasers only.<br><a href=\"/en/pdf-purchase\">About the Lifetime Report</a>');
      if (!res.ok) {
        const detail = await res.json().catch(() => ({}));
        throw new Error(detail.error === 'missing_birth_data'
          ? 'No birth data is registered.<br>Please register your date and place of birth on your <a href=\"/en/mypage\">member page</a>.'
          : 'We could not prepare your report. Please reload the page in a little while.');
      }
      return res.json();
    }

    async function load() {
      const email = localStorage.getItem('lj_user_email');
      const session = localStorage.getItem('lj_session');
      if (!email) {
        setStatus('You need to sign in to read your report.<br>Please <a href=\"/en/mypage\">sign in from your member page</a>.');
        return;
      }
      // Google ログインだと本人確認セッションが無いため、マイページでメール認証してここに戻す
      if (!session) {
        setStatus('Taking you to the identity check, where you confirm the code we email you...');
        window.location.href = '/en/mypage?next=pdf-report';
        return;
      }

      // 未生成の章はサーバ側で分割生成されるため、pending がなくなるまで繰り返す
      let attempt = 0;
      let rendered = false;
      while (attempt < 6) {
        attempt += 1;
        let data;
        try {
          data = await requestReport(email, session);
        } catch (err) {
          if (rendered) return;
          setStatus(err.message || 'The connection failed. Please reload the page in a little while.');
          return;
        }

        render(data);
        statusEl.style.display = 'none';
        bookEl.style.display = 'block';
        rendered = true;

        const progressEl = document.getElementById('progress');
        if (!data.pending || !data.pending.length) {
          progressEl.textContent = '';
          return;
        }
        progressEl.textContent = `Writing the remaining ${data.pending.length} chapters...`;
      }
    }

    function render(data) {
      const a = data.astro || {};
      const c = data.chapters || {};
      const html = [];

      html.push(cover(a));
      html.push(toc());
      if (c.summary) html.push(summaryPage(c.summary, a));
      if (c.ch1) html.push(page(`<h2 class="chapter-title">${esc(c.ch1.title)}</h2>
        <h3>Lagna — the you others see</h3>${para(c.ch1.lagna)}
        <h3>Moon — the you within</h3>${para(c.ch1.moon)}
        <h3>Sun — the direction you aim for</h3>${para(c.ch1.sun)}
        <h3>How the three layers mesh</h3>${para(c.ch1.integration)}`));
      if (c.ch2) html.push(strengthPage(c.ch2, a));
      if (c.ch3) html.push(yogaPage(c.ch3, a));
      if (c.ch4) html.push(monoPage(c.ch4, a));
      if (c.ch5) html.push(kotoPage(c.ch5, a));
      if (c.ch6) html.push(bashoPage(c.ch6, a));
      if (c.ch7) html.push(page(`<h2 class="chapter-title">${esc(c.ch7.title)}</h2>
        <div class="fact">Your working style: <strong>${esc(c.ch7.type)}</strong>
          <span class="reason">${esc(a.boosters?.koto?.workStyle?.reason || '')}</span></div>
        ${para(c.ch7.text)}
        <h3>Environments where you thrive</h3>${para(c.ch7.environment)}
        <h3>Ways of working that drain you</h3>${para(c.ch7.caution)}`));
      if (c.ch8) html.push(wealthPage(c.ch8, a));
      if (c.ch9) html.push(timelinePage(c.ch9, a));
      if (c.ch10) html.push(nowPage(c.ch10, a));
      if (c.ch11) html.push(futurePage(c.ch11, a));
      if (c.ch12) html.push(trialPage(c.ch12, a));
      html.push(chartsPage(a));
      html.push(planetsPage(a));
      html.push(disclaimerPage(data));

      bookEl.innerHTML = html.join('');
    }

    function cover(a) {
      const birth = `${esc(a.birth?.dob || '')} ${esc(a.birth?.tob || '')}`;
      return `<section class="page cover">
        <div><img class="logo" src="/img/libertas-logo.png" alt="Libertas Jyotish"></div>
        <div>
          <h1>Libertas Jyotish</h1>
          <div class="sub">Lifetime Report</div>
        </div>
        <div class="owner">
          Born  ${birth}<br>
          Birthplace  ${esc(a.city || '')}<br>
          Lagna  ${esc(a.ascendant?.sign || '')}  /  Moon  ${esc(a.moon?.sign || '')}  /  ${esc(a.nakshatra || '')}
        </div>
      </section>`;
    }

    function toc() {
      const items = [
        'Your owner\'s manual, at a glance',
        'Chapter 1 The blueprint that is you',
        'Chapter 2 The strongest planet within you',
        'Chapter 3 The kind of good fortune you were born with',
        'Chapter 4 Things — stones and colours',
        'Chapter 5 Practices — habits and ways of working',
        'Chapter 6 Places — directions and environments',
        'Chapter 7 Your calling and how to use your talents',
        'Chapter 8 Your route to abundance',
        'Chapter 9 The map of your destiny (lifetime timeline)',
        'Chapter 10 Where you stand now',
        'Chapter 11 The golden period ahead',
        'Chapter 12 Turning trials into foundations',
        'Appendix Data'
      ];
      return page(`<h2 class="chapter-title">Contents</h2><ul class="toc">${items.map((t) => `<li>${esc(t)}</li>`).join('')}</ul>`);
    }

    function summaryPage(s, a) {
      const list = (arr) => (Array.isArray(arr) ? `<ul>${arr.filter(Boolean).map((v) => `<li>${esc(v)}</li>`).join('')}</ul>` : '');
      const dasha = a.dasha?.current?.maha;
      return page(`<h2 class="chapter-title">Your owner's manual, at a glance</h2>
        <div class="lead">${esc(s.catchphrase)}</div>
        ${para(s.essence)}
        <h3>Qualities that are your weapons</h3>${list(s.weapons)}
        <h3>Areas with room to grow</h3>${list(s.growth)}
        ${dasha ? `<div class="fact">Current major period: ${esc(dasha.lordJa)} (${esc(dasha.start)} – ${esc(dasha.end)})
          <span class="reason">Calculated from Vimshottari Dasha</span></div>` : ''}
        ${para(s.now)}`);
    }

    function strengthPage(ch, a) {
      const rows = (a.strength || []).map((p) => `<div class="bar-row">
        <span>${esc(p.name)}（${esc(p.dignity)}）</span>
        <span class="bar"><span style="width:${Math.max(0, Math.min(100, p.score))}%"></span></span>
        <span>${esc(p.score)}</span></div>`).join('');
      const block = (arr) => (Array.isArray(arr) ? arr.map((i) => `<h3>${esc(i.planet)}</h3>${para(i.text)}`).join('') : '');
      return page(`<h2 class="chapter-title">${esc(ch.title)}</h2>
        ${para(ch.intro)}
        <h3>Strength of the nine planets</h3>${rows}
        <h3>Your weapons</h3>${block(ch.strong)}
        <h3>Room to grow</h3>${block(ch.weak)}
        ${para(ch.closing)}`);
    }

    function yogaPage(ch, a) {
      const items = (ch.items || []).map((y) => {
        const src = (a.yogas || []).find((v) => v.name === y.name);
        return `<div class="fact"><strong>${esc(y.name)}</strong>
          ${src?.group ? `<span class="reason">${esc(src.group)}</span>` : ''}</div>${para(y.text)}`;
      }).join('');
      return page(`<h2 class="chapter-title">${esc(ch.title)}</h2>${para(ch.intro)}${items}${para(ch.closing)}`);
    }

    function monoPage(ch, a) {
      const mono = a.boosters?.mono || {};
      const stone = mono.lifeStone;
      const colors = mono.colors || {};
      const chip = (c) => (c ? `<span class="color-chip" style="background:${esc(c.hex)}"></span>${esc(c.name)}` : '');
      return page(`<h2 class="chapter-title">${esc(ch.title)}</h2>
        ${stone ? `<div class="fact">Life stone: <strong>${esc(stone.stone)}</strong>
          ${stone.alternatives?.length ? ` (alternatives: ${esc(stone.alternatives.join(', '))})` : ''}
          <span class="reason">${esc(stone.reason)}</span></div>` : ''}
        ${para(ch.stone)}
        ${mono.supportStone ? `<div class="fact">Stone supporting your current period: <strong>${esc(mono.supportStone.stone)}</strong>
          <span class="reason">${esc(mono.supportStone.reason)}</span></div>${para(ch.support)}` : ''}
        <h3>Your colour for decisive moments</h3>
        <div class="fact">${chip(colors.main)}${colors.support ? `　／　${chip(colors.support)}` : ''}
          <span class="reason">${esc(colors.reason || '')}</span></div>
        ${para(ch.color)}
        <p class="disclaimer">${esc(ch.note || '')}</p>`);
    }

    function kotoPage(ch, a) {
      const koto = a.boosters?.koto || {};
      const list = (arr) => (Array.isArray(arr) ? `<ul>${arr.map((v) => `<li>${esc(v)}</li>`).join('')}</ul>` : '');
      return page(`<h2 class="chapter-title">${esc(ch.title)}</h2>
        ${koto.workStyle ? `<div class="fact">Your working style: <strong>${esc(koto.workStyle.type)}</strong>　${esc(koto.workStyle.detail)}
          <span class="reason">${esc(koto.workStyle.reason)}</span></div>` : ''}
        ${para(ch.work)}
        <h3>Morning habits</h3>${list(koto.rhythm?.morning)}${para(ch.morning)}
        <h3>Evening habits</h3>${list(koto.rhythm?.night)}${para(ch.night)}
        <h3>Hours when you focus best</h3>
        ${koto.rhythm ? `<div class="fact">${esc(koto.rhythm.focus)}<span class="reason">${esc(koto.rhythm.reason)}</span></div>` : ''}
        ${para(ch.focus)}`);
    }

    function bashoPage(ch, a) {
      const b = a.boosters?.basho || {};
      const box = (d, label, text) => (d ? `<h3>${label}</h3>
        <div class="fact">Direction: <strong>${esc(d.direction)}</strong>  Environment: ${esc((d.environment || []).join(', '))}
          <span class="reason">${esc(d.reason)}</span></div>${para(text)}` : '');
      return page(`<h2 class="chapter-title">${esc(ch.title)}</h2>
        ${box(b.primary, 'Your natural direction', ch.primary)}
        ${box(b.career, 'Environments where you perform at work', ch.career)}
        ${box(b.rest, 'Environments good for recovery', ch.rest)}`);
    }

    function wealthPage(ch, a) {
      const av = a.ashtakavarga;
      const rows = av ? av.houses.map((h) => `<div class="bar-row">
        <span>${esc(h.label)}</span>
        <span class="bar"><span style="width:${Math.max(0, Math.min(100, Math.round(h.score / 50 * 100)))}%"></span></span>
        <span>${esc(h.score)} pts</span></div>`).join('') : '';
      return page(`<h2 class="chapter-title">${esc(ch.title)}</h2>
        ${para(ch.intro)}
        ${av ? `<div class="fact">The twelve areas total 337 points, an average of ${esc(av.average)} points.
          <span class="reason">Calculated from Sarvashtakavarga</span></div>${rows}` : ''}
        <h3>Strong areas</h3>${para(ch.strong)}
        <h3>Areas to shore up</h3>${para(ch.weak)}
        <h3>Where abundance enters</h3>${para(ch.money)}
        <h3>How to order your spending</h3>${para(ch.spending)}`);
    }

    function timelinePage(ch, a) {
      const map = new Map((ch.periods || []).map((p) => [p.lord, p.text]));
      const rows = (a.dasha?.timeline || []).map((t) => `<tr>
        <td>${esc(t.lordJa)} period</td><td>${esc(t.start)} – ${esc(t.end)}</td>
        <td>${esc(t.season)}${t.isCurrent ? ' (current)' : ''}</td>
        <td>${esc(map.get(t.lordJa) || map.get(t.lord) || '')}</td></tr>`).join('');
      return page(`<h2 class="chapter-title">${esc(ch.title)}</h2>
        ${para(ch.intro)}
        <table><thead><tr><th>Cycle</th><th>Period</th><th>Character</th><th>Theme</th></tr></thead><tbody>${rows}</tbody></table>
        <h3>Transitions so far</h3>${para(ch.past)}`);
    }

    function nowPage(ch, a) {
      const cur = a.dasha?.current;
      const list = (arr) => (Array.isArray(arr) ? `<ul>${arr.filter(Boolean).map((v) => `<li>${esc(v)}</li>`).join('')}</ul>` : '');
      const line = (label, d) => (d ? `${label}: ${esc(d.lordJa)} (${esc(d.start)} – ${esc(d.end)})<br>` : '');
      return page(`<h2 class="chapter-title">${esc(ch.title)}</h2>
        ${cur ? `<div class="fact">${line('Major period', cur.maha)}${line('Sub period', cur.antar)}${line('Minor period', cur.pratyantar)}
          <span class="reason">Calculated from Vimshottari Dasha</span></div>` : ''}
        ${para(ch.text)}
        <h3>What works in this period</h3>${list(ch.todo)}
        <h3>Decisions to avoid</h3>${list(ch.avoid)}`);
    }

    function futurePage(ch, a) {
      const rows = (a.dasha?.upcoming || []).map((u) => `<tr>
        <td>${esc(u.maha)} / ${esc(u.antar)}</td><td>${esc(u.start)} 〜 ${esc(u.end)}</td></tr>`).join('');
      const blocks = (ch.periods || []).map((p) => `<h3>${esc(p.label)}</h3>${para(p.text)}`).join('');
      return page(`<h2 class="chapter-title">${esc(ch.title)}</h2>
        ${para(ch.intro)}
        <table><thead><tr><th>Major period / sub period</th><th>Period</th></tr></thead><tbody>${rows}</tbody></table>
        ${blocks}${para(ch.closing)}`);
    }

    function trialPage(ch, a) {
      const ss = a.sadeSati;
      const rows = ss?.transits?.length ? `<table><thead><tr><th>Stage</th><th>Position of Saturn</th><th>Period</th></tr></thead><tbody>
        ${ss.transits.map((t) => `<tr><td>${esc(t.phase)}</td><td>${esc(t.sign)}</td><td>${esc(t.start)} 〜 ${esc(t.end)}</td></tr>`).join('')}
        </tbody></table>` : '';
      const list = (arr) => (Array.isArray(arr) ? `<ul>${arr.filter(Boolean).map((v) => `<li>${esc(v)}</li>`).join('')}</ul>` : '');
      return page(`<h2 class="chapter-title">${esc(ch.title)}</h2>
        ${para(ch.intro)}
        <h3>Sade Sati (Saturn's period of adjustment)</h3>
        ${ss ? `<div class="fact">Applies: ${ss.active ? 'Yes' : 'No'}${ss.phase ? ` (${esc(ss.phase)})` : ''}
          <span class="reason">Calculated from sade-sati</span></div>` : ''}
        ${rows}${para(ch.sadeSati)}
        <h3>Mangal Dosha (a strong placement of Mars)</h3>
        ${a.mangalDosha ? `<div class="fact">Applies: ${a.mangalDosha.hasDosha ? 'Yes' : 'No'}
          <span class="reason">Assessed from mangal-dosha</span></div>` : ''}
        ${para(ch.mangal)}
        <h3>What you can start today</h3>${list(ch.actions)}
        ${para(ch.closing)}`);
    }

    function chartsPage(a) {
      const box = (svg, caption) => (svg ? `<figure class="chart-box">${svg}<figcaption>${esc(caption)}</figcaption></figure>` : '');
      const charts = a.charts || {};
      return page(`<h2 class="chapter-title">Appendix Charts</h2>
        <div class="chart-grid">
          ${box(charts.d1, 'D1 Rashi (life as a whole)')}
          ${box(charts.d9, 'D9 Navamsha (later life, partner)')}
          ${box(charts.d10, 'D10 Dashamsha (work, society)')}
        </div>
        <p class="disclaimer">The charts follow the North Indian style. The number in each section is the house number, and the symbols are the planets placed there.</p>`);
    }

    function planetsPage(a) {
      const dignity = new Map((a.strength || []).map((s) => [s.key, s.dignity]));
      const rows = (a.planets || []).map((p) => `<tr>
        <td>${esc(p.name)}</td><td>${esc(p.sign)}</td><td>${p.degree == null ? '' : esc(p.degree)}</td>
        <td>${p.house == null ? '' : esc(p.house)}</td><td>${esc(p.nakshatra)}</td>
        <td>${p.retrograde ? 'Retrograde' : ''}</td><td>${esc(dignity.get(p.key) || '')}</td></tr>`).join('');
      return page(`<h2 class="chapter-title">Appendix Planetary data</h2>
        <table><thead><tr><th>Planet</th><th>Sign</th><th>Degree</th><th>House</th><th>Nakshatra</th><th>Retrograde</th><th>Dignity</th></tr></thead>
        <tbody>${rows}</tbody></table>`);
    }

    function disclaimerPage(data) {
      return page(`<h2 class="chapter-title">Before you read</h2>
        <p class="disclaimer">
          This report is written from Vedic astrology calculations based on the birth data you provided.\\n          It is not medical, investment or legal advice, and it cannot be used as the basis for diagnosis, treatment, trading decisions or legal judgements.\\n          For decisions about health, assets or contracts, always consult a professional in that field.<br><br>
          The periods described are based on Vimshottari Dasha calculations and do not indicate whether any particular date is auspicious.\\n          Stones, colours and directions are suggestions drawn from classical correspondence tables and no effect is guaranteed.<br><br>
          Issued: ${esc((data.astro?.generated_at || '').slice(0, 10))}<br>
          &copy; Libertas Jyotish
        </p>`);
    }

    load();
  </script>
</body>
