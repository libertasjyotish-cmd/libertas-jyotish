<!DOCTYPE html>
<html {{htmlAttrs}}>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{t.pdf-purchase.text01}}</title>
  <meta name="description" content="{{t.pdf-purchase.content01|attr}}">
  <!-- SNS共有カード（OGP / Twitter） -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Libertas Jyotish">
  <meta property="og:locale" content="{{ogLocale}}">
  <meta property="og:title" content="{{t.pdf-purchase.text01|attr}}">
  <meta property="og:description" content="{{t.pdf-purchase.content01|attr}}">
  <meta property="og:url" content="{{canonical}}">
  <meta property="og:image" content="https://www.libertas-jyotish.com/img/og-image.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <!-- カノニカルURL設定（Google審査・SEOリダイレクトエラー対策） -->
  <link rel="canonical" href="{{canonical}}">
  {{hreflang}}
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0c1a1f">
  <link rel="icon" type="image/png" href="/img/libertas-logo.png">
  <link rel="apple-touch-icon" href="/img/libertas-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="{{fontHref}}" rel="stylesheet">
  
  <style>
    :root {
      --color-gold-light: #FDE047;
      --color-gold-main: #D4AF37;
      --color-gold-dark: #8B6B1B;
      --color-text-dark: #2C221E;
      --font-en: 'Cinzel', serif;
      --font-ja: {{fontFamily}};
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-ja);
      color: var(--color-text-dark);
      line-height: 1.8;
      min-height: 100vh;
      overflow-x: hidden;
      background-color: #0c1a1f;
      display: flex; flex-direction: column;
    }

    .site-header {
      position: fixed; top: 0; left: 0; width: 100%; z-index: 100;
      background: rgba(12, 26, 31, 0.92);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(139, 107, 27, 0.3);
      padding: 12px 20px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .header-logo {
      display: flex; align-items: center; gap: 10px;
      text-decoration: none; color: var(--color-gold-main);
      font-family: var(--font-en); font-weight: 600; font-size: 1.05rem;
    }
    .header-logo img { width: 32px; height: 32px; }
    .header-nav { display: flex; gap: 18px; align-items: center; }
    .header-nav a { color: #E2D9CE; text-decoration: none; font-size: 0.82rem; transition: color 0.3s; }
    .header-nav a:hover { color: var(--color-gold-main); }

    .main-section {
      position: relative; flex: 1;
      display: flex; align-items: center; justify-content: center;
      padding: 100px 20px 60px;
      background-image: linear-gradient(rgba(12, 26, 31, 0.45), rgba(12, 26, 31, 0.45)), url("/img/bg-jyotish.jpg");
      background-size: cover; background-position: center; background-attachment: fixed;
    }

    .card-container {
      position: relative; z-index: 2; width: 100%; max-width: 680px;
      background-image: 
        radial-gradient(circle at 50% 25%, rgba(255, 253, 245, 0.98) 0%, rgba(245, 233, 208, 0.95) 55%, rgba(220, 200, 162, 0.96) 100%),
        linear-gradient(135deg, rgba(255, 255, 255, 0.4) 0%, rgba(0, 0, 0, 0.05) 100%);
      background-blend-mode: overlay, normal;
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      border-radius: 14px;
      border: 1px solid rgba(184, 142, 60, 0.65);
      outline: 1px solid rgba(212, 175, 55, 0.35); outline-offset: -7px;
      box-shadow: 
        0 25px 50px -12px rgba(0, 0, 0, 0.75),
        0 0 20px rgba(212, 175, 55, 0.18),
        inset 0 0 35px rgba(139, 90, 43, 0.28),
        inset 0 2px 4px rgba(255, 255, 255, 0.8);
      padding: 45px 35px 40px; text-align: center; margin-bottom: 30px;
      overflow: hidden;
    }
    /* 背面に薄く敷く曼荼羅（装飾のみ） */
    .card-container::before {
      content: ''; position: absolute; top: 4px; left: 50%;
      width: min(520px, 96%); aspect-ratio: 1 / 1; transform: translateX(-50%);
      z-index: 0; pointer-events: none;
      background: url('/img/mandala-wheel.png') no-repeat center / contain;
      opacity: 0.2;
      -webkit-mask-image: radial-gradient(circle at 50% 50%, #000 55%, transparent 82%);
      mask-image: radial-gradient(circle at 50% 50%, #000 55%, transparent 82%);
    }
    .card-container > * { position: relative; z-index: 1; }

    .data-confirm-box {
      background: rgba(255, 252, 245, 0.85);
      border: 1px solid rgba(139, 107, 27, 0.35); border-radius: 10px;
      padding: 22px; margin-bottom: 25px; text-align: left;
      box-shadow: inset 0 2px 4px rgba(112, 76, 32, 0.12);
    }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 0.82rem; font-weight: 600; color: var(--color-text-dark); margin-bottom: 6px; }
    .label-note { font-size: 0.72rem; font-weight: normal; color: #7a6a58; margin-left: 4px; }
    
    input[type="email"], input[type="text"], input[type="datetime-local"] {
      width: 100%; padding: 11px 14px;
      background-color: rgba(255, 252, 245, 0.85);
      border: 1px solid rgba(139, 107, 27, 0.4); border-radius: 8px;
      font-family: inherit; font-size: 0.9rem; color: var(--color-text-dark); outline: none; transition: all 0.3s ease;
      box-shadow: inset 0 2px 4px rgba(112, 76, 32, 0.12);
    }
    input:focus {
      border-color: var(--color-gold-dark);
      box-shadow: inset 0 2px 4px rgba(112, 76, 32, 0.15), 0 0 8px rgba(212, 175, 55, 0.3);
      background-color: #FFFDF9;
    }

    .btn-purchase {
      width: 100%; padding: 15px 28px; font-size: 1.05rem; font-weight: 600; font-family: var(--font-ja); color: #FFFDF9;
      background: linear-gradient(135deg, #C59B27 0%, var(--color-gold-dark) 100%); border: none; border-radius: 8px; cursor: pointer;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35), inset 0 1px 1px rgba(255, 255, 255, 0.4); transition: transform 0.2s;
    }
    .btn-purchase:hover { transform: translateY(-1px); }

    .report-card {
      background: rgba(255, 252, 245, 0.85);
      border: 1px solid rgba(139, 107, 27, 0.35); border-radius: 10px;
      padding: 22px; margin-bottom: 20px; text-align: left;
      box-shadow: inset 0 2px 4px rgba(112, 76, 32, 0.12);
    }
    .report-card h3 { font-size: 1.05rem; color: var(--color-gold-dark); margin-bottom: 10px; border-bottom: 1px solid rgba(139, 107, 27, 0.2); padding-bottom: 5px; }
    
    .kundali-img-wrapper { text-align: center; padding: 12px; background: #FFFDF9; border: 1px solid rgba(139, 107, 27, 0.3); border-radius: 8px; margin-bottom: 15px; }
    .kundali-img-wrapper img { max-width: 100%; height: auto; max-height: 280px; }

    .timeline-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; margin-top: 8px; }
    .timeline-table th, .timeline-table td { padding: 8px 10px; border: 1px solid rgba(139, 107, 27, 0.3); text-align: left; }
    .timeline-table th { background: rgba(212, 175, 55, 0.15); color: var(--color-gold-dark); font-weight: 600; }

    .site-footer { width: 100%; background: rgba(8, 18, 22, 0.95); border-top: 1px solid rgba(139, 107, 27, 0.3); padding: 24px 20px; text-align: center; position: relative; z-index: 10; }
    .footer-links a { color: var(--color-gold-main); text-decoration: none; font-size: 0.82rem; }
    .copyright { font-size: 0.75rem; color: #8A9A9E; font-family: var(--font-en); margin-top: 8px; }

    @media print {
      .site-header, .site-footer, .btn-purchase, #btn-print-pdf { display: none !important; }
      body { background: #ffffff !important; color: #000000 !important; }
      .main-section { padding: 0 !important; background: none !important; }
      .card-container { max-width: 100% !important; box-shadow: none !important; border: none !important; outline: none !important; background: #ffffff !important; padding: 0 !important; }
      .card-container::before { display: none !important; }
      .report-card { background: #ffffff !important; border: 1px solid #ccc !important; page-break-inside: avoid; }
    }
  </style>
<link rel="stylesheet" href="/css/site-menu.css">
<link rel="stylesheet" href="/css/rtl.css">
{{>i18n-globals}}
<script defer src="/js/site-menu.js"></script>
<script src="/js/checkout-links.js"></script>
</head>
<body>

  <header class="site-header" data-site-header></header>

  <section class="main-section">
    <div class="card-container">
      
      <div id="purchased-view" style="display:none;">
        <h1 style="font-size:1.5rem; color:var(--color-text-dark); margin-bottom:12px;">{{t.pdf-purchase.text02}}</h1>
        <p style="font-size:0.9rem; color:#5A4E48; margin-bottom:22px;">{{t.pdf-purchase.text03}}</p>
        <a id="btn-open-report" class="btn-purchase" style="display:inline-block; text-decoration:none; text-align:center;" href="/{{lang}}/pdf-report">{{t.pdf-purchase.text04}}</a>
      </div>

      <div id="purchase-form-view" style="display:none;">
        <h1 style="font-size:1.5rem; color:var(--color-text-dark); margin-bottom:12px;">{{t.pdf-purchase.text05}}</h1>
        <p style="font-size:0.88rem; color:#5A4E48; margin-bottom:25px; line-height:1.9; text-align:left;">{{t.pdf-purchase.text06}}</p>

        <div class="data-confirm-box">
          <div class="form-group"><label for="user-email">{{t.pdf-purchase.text07}}</label><input type="email" id="user-email" required></div>
          <div class="form-group"><label for="user-birthdate">{{t.pdf-purchase.text08}} <span class="label-note">{{t.pdf-purchase.text13}}</span></label><input type="datetime-local" id="user-birthdate" required></div>
          <div class="form-group"><label for="user-birthplace">{{t.pdf-purchase.text09}}</label><input type="text" id="user-birthplace" placeholder="{{t.pdf-purchase.placeholder01|attr}}" required></div>
        </div>

        <div id="price-label" style="font-size:1.3rem; font-weight:700; color:var(--color-gold-dark); margin-bottom:15px;"></div>
        <button id="btn-proceed-checkout" class="btn-purchase">{{t.pdf-purchase.text10}}</button>
        <p id="checkout-note" style="font-size:0.8rem; color:#6A5E58; margin-top:12px;">{{t.pdf-purchase.text11}}</p>
      </div>

    </div>
  </section>

  <footer class="site-footer">
    <div class="footer-links"><a href="/{{lang}}/legal">{{t.pdf-purchase.text12}}</a></div>
    <p class="copyright">&copy; Libertas Jyotish All Rights Reserved.</p>
  </footer>

  <script>
    // 価格と買い切りPayment Linkは訪問者の国の価格帯に応じて /js/checkout-links.js が解決する
    const pdfPriceLabel = () => window.LJCheckout.labelFor('pdf');
    const pdfCheckoutUrl = () => window.LJCheckout.linkFor('pdf');

    // 購入済みかどうかはサーバー（会員シート）だけを正とする。
    // 購入済みなら購入フォームを出さず、鑑定書への導線に差し替える。
    async function showPurchaseStateView() {
      const formView = document.getElementById('purchase-form-view');
      const purchasedView = document.getElementById('purchased-view');
      const email = localStorage.getItem('lj_user_email') || '';

      if (email) {
        try {
          const res = await fetch('/api/jyotish', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: 'purchase_status', email: email })
          });
          const data = await res.json().catch(() => null);
          if (res.ok && data && data.pdf_purchased) {
            purchasedView.style.display = 'block';
            return;
          }
        } catch (err) {
          console.error('purchase status check failed', err);
        }
      }
      formView.style.display = 'block';
    }

    document.addEventListener('DOMContentLoaded', () => {
      showPurchaseStateView();
      document.getElementById('price-label').textContent = pdfPriceLabel();
      // 国判定が返ってきたら価格表示を確定させる
      window.LJCheckout.ready.then(() => {
        document.getElementById('price-label').textContent = pdfPriceLabel();
      });
      const savedEmail = localStorage.getItem('lj_user_email') || '';
      const savedBirthdate = localStorage.getItem('lj_user_birthdate') || '';
      const savedBirthplace = localStorage.getItem('lj_user_birthplace') || '';

      if (savedEmail) document.getElementById('user-email').value = savedEmail;
      if (savedBirthdate) document.getElementById('user-birthdate').value = savedBirthdate;
      if (savedBirthplace) document.getElementById('user-birthplace').value = savedBirthplace;


      document.getElementById('btn-proceed-checkout').addEventListener('click', () => {
        const email = document.getElementById('user-email').value;
        const birthdate = document.getElementById('user-birthdate').value;
        const birthplace = document.getElementById('user-birthplace').value;

        if (!email) { alert('{{t.pdf-purchase.js01|js}}'); return; }
        if (!birthdate) { alert('{{t.pdf-purchase.js02|js}}'); return; }
        if (!birthplace) { alert('{{t.pdf-purchase.js03|js}}'); return; }

        localStorage.setItem('lj_user_email', email);
        localStorage.setItem('lj_user_birthdate', birthdate);
        localStorage.setItem('lj_user_birthplace', birthplace);
        // 鑑定書ページと同じキーで出生データを保持する
        const [datePart, timePart] = birthdate.split('T');
        if (datePart) localStorage.setItem('dob', datePart);
        if (timePart) localStorage.setItem('tob', timePart.slice(0, 5));
        localStorage.setItem('city', birthplace);

        const checkoutUrl = pdfCheckoutUrl();
        const separator = checkoutUrl.includes('?') ? '&' : '?';
        window.location.href = `${checkoutUrl}${separator}prefilled_email=${encodeURIComponent(email)}`;
      });
    });

  </script>
</body>
</html>
