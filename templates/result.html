<!DOCTYPE html>
<html {{htmlAttrs}}>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{t.result.text01}}</title>
<meta name="robots" content="noindex">
<!-- カノニカルURL設定（Google審査・SEOリダイレクトエラー対策） -->
<link rel="canonical" href="{{canonical}}">
{{hreflang}}
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0c1a1f">
<link rel="icon" type="image/png" href="/img/libertas-logo.png">
<link rel="apple-touch-icon" href="/img/libertas-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="{{fontHref}}" rel="stylesheet">

<style>
:root {
--color-gold-light: #FDE047; --color-gold-main: #D4AF37; --color-gold-dark: #8B6B1B;
--color-text-dark: #2C221E; --font-en: 'Cinzel', serif; --font-ja: {{fontFamily}};
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-ja); color: var(--color-text-dark); line-height: 1.8; min-height: 100vh; overflow-x: hidden; background-color: #0c1a1f; display: flex; flex-direction: column; }

.site-header {
position: fixed; top: 0; left: 0; width: 100%; z-index: 100; background: rgba(12, 26, 31, 0.92);
backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-bottom: 1px solid rgba(139, 107, 27, 0.3);
padding: 12px 20px; display: flex; justify-content: space-between; align-items: center;
}
.header-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--color-gold-main); font-family: var(--font-en); font-weight: 600; font-size: 1.05rem; }
.header-logo img { width: 32px; height: 32px; }
.header-nav { display: flex; gap: 18px; align-items: center; }
.header-nav a { color: #E2D9CE; text-decoration: none; font-size: 0.82rem; transition: color 0.3s; }
.nav-btn-member { border: 1px solid var(--color-gold-main); color: var(--color-gold-main) !important; padding: 4px 12px; border-radius: 4px; background: rgba(212, 175, 55, 0.1); }

.main-section {
position: relative; flex: 1; display: flex; align-items: center; justify-content: center; padding: 100px 20px 60px;
background-image: linear-gradient(rgba(12, 26, 31, 0.45), rgba(12, 26, 31, 0.45)), url("/img/bg-jyotish.jpg");
background-size: cover; background-position: center; background-attachment: fixed;
}

/* 羊皮紙カードスタイル統一 */
.result-container {
position: relative; z-index: 2; width: 100%; max-width: 640px;
background-image:
radial-gradient(circle at 50% 25%, rgba(255, 253, 245, 0.98) 0%, rgba(245, 233, 208, 0.95) 55%, rgba(220, 200, 162, 0.96) 100%),
linear-gradient(135deg, rgba(255, 255, 255, 0.4) 0%, rgba(0, 0, 0, 0.05) 100%);
background-blend-mode: overlay, normal;
backdrop-filter: blur(8px);-webkit-backdrop-filter: blur(8px);
border-radius: 14px;
border: 1px solid rgba(184, 142, 60, 0.65);
outline: 1px solid rgba(212, 175, 55, 0.35); outline-offset: -7px;
box-shadow:
0 25px 50px -12px rgba(0, 0, 0, 0.75),
0 0 20px rgba(212, 175, 55, 0.18),
inset 0 0 35px rgba(139, 90, 43, 0.28),
inset 0 2px 4px rgba(255, 255, 255, 0.8);
padding: 45px 35px 40px; text-align: center; margin-bottom: 30px;
}

.header-area { text-align: center; margin-bottom: 25px; }
.logo-img { width: 75px; height: auto; margin-bottom: 8px; filter: drop-shadow(0px 3px 6px rgba(139, 107, 27, 0.3)); }
.badge { display: inline-block; font-family: var(--font-en); font-size: 0.75rem; letter-spacing: 0.2em; color: var(--color-gold-dark); border: 1px solid rgba(139, 107, 27, 0.4); background: rgba(212, 175, 55, 0.12); padding: 3px 14px; border-radius: 50px; margin-bottom: 10px; text-transform: uppercase; }

.loading-box { text-align: center; padding: 40px 10px; }
.spinner { width: 40px; height: 40px; margin: 0 auto 20px; border: 3px solid rgba(139, 107, 27, 0.2); border-top-color: var(--color-gold-dark); border-radius: 50%; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.loading-title { font-size: 1rem; font-weight: 600; color: var(--color-gold-dark); margin-bottom: 6px; }

.meta-card { text-align: left; font-size: 0.82rem; color: #5A4E48; background: rgba(212, 175, 55, 0.12); padding: 12px 16px; border-radius: 8px; margin-bottom: 24px; border: 1px solid rgba(139, 107, 27, 0.3); }
.result-body { font-size: 0.95rem; line-height: 1.85; color: var(--color-text-dark); margin-bottom: 30px; text-align: left; }
.result-body h2 { font-size: 1.35rem; color: var(--color-gold-dark); margin: 25px 0 12px; border-bottom: 1px dashed rgba(139, 107, 27, 0.4); padding-bottom: 6px; }
.result-body h3 { font-size: 1.1rem; color: var(--color-gold-dark); margin: 20px 0 8px; border-left: 3px solid var(--color-gold-main); padding-left: 8px; }

.cta-card { background: rgba(255, 253, 248, 0.85); border: 1px solid rgba(212, 175, 55, 0.6); border-radius: 12px; padding: 24px 20px; text-align: center; margin-top: 35px; }
.btn-primary { display: inline-block; width: 100%; padding: 14px 20px; font-size: 1rem; font-weight: 600; color: #FFFDF9; background: linear-gradient(135deg, #C59B27 0%, var(--color-gold-dark) 100%); border: none; border-radius: 8px; text-decoration: none; cursor: pointer; }
.btn-secondary { display: block; width: 100%; margin-top: 15px; padding: 10px; background: transparent; border: 1px solid rgba(139, 107, 27, 0.4); color: var(--color-gold-dark); border-radius: 6px; font-size: 0.85rem; text-decoration: none; text-align: center; }

/* 無料鑑定の下に「会員なら見られる内容」をぼかし表示して差分を可視化する */
.locked-section { margin-top: 35px; text-align: left; }
.locked-section-title { font-size: 1.05rem; color: var(--color-gold-dark); font-weight: 700; margin-bottom: 4px; }
.locked-section-lead { font-size: 0.82rem; color: #5A4E48; margin-bottom: 14px; }
.locked-wrapper { position: relative; border-radius: 10px; }
.preview-card { background: rgba(255, 253, 248, 0.85); border: 1px solid rgba(139, 107, 27, 0.28); border-radius: 10px; padding: 14px 16px; margin-bottom: 12px; }
.preview-card:last-child { margin-bottom: 0; }
.preview-title { font-size: 0.92rem; font-weight: 700; color: var(--color-gold-dark); margin-bottom: 6px; }
.preview-text { font-size: 0.84rem; color: #4a3e36; line-height: 1.75; }
.preview-table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 0.8rem; }
.preview-table th, .preview-table td { padding: 6px 8px; border: 1px solid rgba(139, 107, 27, 0.3); text-align: left; }
.preview-table th { background: rgba(212, 175, 55, 0.18); color: var(--color-gold-dark); }
.blur-content { filter: blur(4px); user-select: none; pointer-events: none; opacity: 0.75; }
.lock-overlay {
margin-top: 14px; background: rgba(212, 175, 55, 0.14); border: 1px solid rgba(139, 107, 27, 0.35);
border-radius: 10px; padding: 18px 16px; text-align: center;
}
.lock-overlay .lock-icon { font-size: 1.8rem; margin-bottom: 6px; }
.lock-overlay .lock-title { font-weight: 700; color: var(--color-gold-dark); margin-bottom: 8px; }
.lock-overlay .lock-note { font-size: 0.82rem; color: #5A4E48; margin-bottom: 15px; }

.site-footer { width: 100%; background: rgba(8, 18, 22, 0.95); border-top: 1px solid rgba(139, 107, 27, 0.3); padding: 24px 20px; text-align: center; position: relative; z-index: 10; }
.footer-links a { color: var(--color-gold-main); text-decoration: none; font-size: 0.82rem; }
.copyright { font-size: 0.75rem; color: #8A9A9E; font-family: var(--font-en); margin-top: 8px; }
</style>
<link rel="stylesheet" href="/css/site-menu.css">
<link rel="stylesheet" href="/css/rtl.css">
{{>i18n-globals}}
<script defer src="/js/site-menu.js"></script>
<script src="/js/checkout-links.js"></script>
</head>
<body>

<header class="site-header" data-site-header></header>

<section class="main-section">
<div class="result-container">
<div class="header-area">
<img src="/img/libertas-logo.png" alt="Logo" class="logo-img"><br>
<span class="badge">Moon Sign Reading</span>
</div>
<div id="content-area">
<div class="loading-box">
<div class="spinner"></div><p class="loading-title" id="loading-title">{{t.result.text02}}</p>
<p id="loading-note" style="font-size:0.8rem; color:#7a6a58; margin-top:6px;">{{t.result.text03}}</p>
</div>
</div>
</div>
</section>

<footer class="site-footer">
<div class="footer-links"><a href="/{{lang}}/legal">{{t.result.text04}}</a></div>
<p class="copyright">&copy; Libertas Jyotish All Rights Reserved.</p>
</footer>

<script>
// ★重要：アプリのメジャーアップデート時にブラウザの古い・壊れたキャッシュを安全に強制破棄するバージョンロック
const LJ_APP_VERSION = 'v12';
const currentVersion = localStorage.getItem('lj_app_version');
if (currentVersion !== LJ_APP_VERSION) {
  console.log("App upgrade detected. Self-healing database caches but protecting active session inputs...");
  const email = localStorage.getItem('lj_user_email') || localStorage.getItem('email');
  
  // 💥 セッションに入っている貴重な入力データを一時メモリにレスキュー退避！
  const savedInput = sessionStorage.getItem('lj_user_input');
  const backupInput = localStorage.getItem('lj_user_input_backup');
  
  localStorage.clear();
  sessionStorage.clear();
  
  // クリア後にデータを美しく復元
  if (email) localStorage.setItem('lj_user_email', email);
  if (savedInput) sessionStorage.setItem('lj_user_input', savedInput);
  if (backupInput) {
    localStorage.setItem('lj_user_input_backup', backupInput);
    sessionStorage.setItem('lj_user_input', backupInput);
  }
  
  localStorage.setItem('lj_app_version', LJ_APP_VERSION);
  location.reload();
}

if ('serviceWorker' in navigator) {
let refreshing = false;
navigator.serviceWorker.addEventListener('controllerchange', () => {
if (refreshing) return;
refreshing = true;
window.location.reload();
});
}

const JYOTISH_API_URL = "/api/jyotish";
// 決済リンクは訪問者の国の価格帯に応じて /js/checkout-links.js が解決する
const premiumUpgradeUrl = () => window.LJCheckout.linkFor('premium');

document.addEventListener('DOMContentLoaded', async () => {
const contentArea = document.getElementById('content-area');
let savedInput = sessionStorage.getItem('lj_user_input');
if (!savedInput) {
  // ★バックアップからの自動引き継ぎレスキューロジック
  const backupInput = localStorage.getItem('lj_user_input_backup');
  if (backupInput) {
    console.log("[RECOVERY] sessionStorage was lost, but localStorage backup was restored successfully!");
    sessionStorage.setItem('lj_user_input', backupInput);
    savedInput = backupInput;
  }
}
const savedResult = sessionStorage.getItem('lj_diagnosis_result');

// ★自己修復：キャッシュデータ内に未展開 of バグ文字列がないか自動検査して破棄
let isCorrupted = false;
if (savedResult) {
  try {
    if (savedResult.includes('\\${') || savedResult.includes('${')) {
      console.warn("Corrupt diagnosis cache detected. Self-healing by removing...");
      sessionStorage.removeItem('lj_diagnosis_result');
      isCorrupted = true;
    }
  } catch(e) {}
}

// 前日以前のキャッシュは「本日の運勢」として使わず、再取得する
const jstToday = new Date(Date.now() + 9 * 3600 * 1000).toISOString().slice(0, 10);
if (savedResult && !isCorrupted) {
const parsedResult = JSON.parse(savedResult);
if (parsedResult && parsedResult.reading_date === jstToday) {
renderDiagnosis(parsedResult, savedInput ? JSON.parse(savedInput) : null);
return;
}
sessionStorage.removeItem('lj_diagnosis_result');
}

if (savedInput) {
const payload = JSON.parse(savedInput);

// 鑑定生成は数十秒かかるため、進行状況を順に見せて無反応に見えないようにする
const progressSteps = [
  '{{t.result.js01|js}}',
  '{{t.result.js02|js}}',
  '{{t.result.js03|js}}',
  '{{t.result.js04|js}}'
];
let progressIndex = 0;
const progressTimer = setInterval(() => {
  progressIndex = Math.min(progressIndex + 1, progressSteps.length - 1);
  const titleElem = document.getElementById('loading-title');
  if (titleElem) titleElem.textContent = progressSteps[progressIndex];
}, 9000);

// ブラウザが無限に待たないよう自分で打ち切り、再試行を案内する
const abortController = new AbortController();
const clientTimeout = setTimeout(() => abortController.abort(), 90000);

try {
const response = await fetch(JYOTISH_API_URL, {
method: 'POST',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify(payload),
signal: abortController.signal
});

if (!response.ok) {
  let errMsg = `HTTP error! status: ${response.status}`;
  try {
    const errJson = await response.json();
    if (errJson && errJson.error) errMsg = errJson.error;
  } catch(e) {}
  throw new Error(errMsg);
}

const data = await response.json();
sessionStorage.setItem('lj_diagnosis_result', JSON.stringify(data));

// ★マイページでの即時表示・データ引継ぎのために jyotish_user キャッシュを保存
try {
const userData = {
email: payload.email,
dob: payload.dob,
tob: payload.tob,
city: payload.city || payload.address,
language: payload.language || '{{lang}}',
status: data.status || 'free',
lastResult: data
};
localStorage.setItem('jyotish_user', JSON.stringify(userData));
localStorage.setItem('lj_user_email', payload.email);
} catch (e) {
console.error("Failed to save jyotish_user:", e);
}

renderDiagnosis(data, payload);
} catch (err) {
console.error("{{t.result.js05|js}}", err);
const timedOut = err && err.name === 'AbortError';
contentArea.innerHTML = `
<div style="text-align:center; padding:20px;">
<p style="color:#c0392b; font-weight:bold; font-size:1.05rem;">${timedOut ? '{{t.result.js06|js}}' : '{{t.result.js07|js}}'}</p>
<p style="font-size:0.85rem; color:#5A4E48; margin-top:8px;">${timedOut ? '{{t.result.js08|js}}' : '{{t.result.js09|js}}'}</p>
<button id="retry-diagnosis" class="btn-primary" style="margin-top:15px; padding:12px 24px; border:none; border-radius:8px; font-weight:600; cursor:pointer;">{{t.result.tpl01|tpl}}</button>
<div><a href="/{{lang}}" class="btn-secondary" style="margin-top:12px; display:inline-block;">{{t.result.tpl02|tpl}}</a></div>
</div>
`;
const retryBtn = document.getElementById('retry-diagnosis');
if (retryBtn) retryBtn.addEventListener('click', () => location.reload());
} finally {
clearInterval(progressTimer);
clearTimeout(clientTimeout);
}
} else {
  // ★強制送還をブロックして、画面上に丁寧な再入力を促すUIを自動描画！
  console.error("[CRITICAL] Birth data input not found in sessionStorage or backup.");
  contentArea.innerHTML = `
    <div style="text-align:center; padding:30px 10px;">
      <div style="font-size:2.5rem; margin-bottom:15px;">🔍💎</div>
      <p style="color:#c0392b; font-weight:bold; font-size:1.1rem; margin-bottom:10px;">{{t.result.tpl03|tpl}}</p>
      <p style="font-size:0.85rem; color:#5A4E48; line-height:1.6; margin-bottom:20px;">
        {{t.result.tpl04|tpl}}
      </p>
      <a href="/{{lang}}" class="btn-primary" style="display:inline-block; text-decoration:none; padding:12px 24px; font-weight:600; border-radius:8px; width:auto; max-width:260px;">{{t.result.tpl05|tpl}}</a>
    </div>
  `;
}
});

function renderDiagnosis(result, input) {
let readingContent = result.reading || result.result || JSON.stringify(result);

// ★【拡張ロジック】新簡易鑑定の4大要素（free_reading）が返ってきた場合に綺麗にカードレイアウト化
if (result.free_reading) {
const fr = result.free_reading;
readingContent = `
<h2>{{t.result.tpl06|tpl}}</h2>

<div style="margin-bottom:20px; border-bottom:1px dashed rgba(139,107,27,0.25); padding-bottom:12px;">
<p style="font-weight:bold; color:var(--color-gold-dark); margin-bottom:4px;">{{t.result.tpl07|tpl}}</p>
<p style="font-size:1.15rem; font-weight:700; color:var(--color-text-dark); margin-left:8px;">${result.sunSign || '-'}</p>
</div>

<div style="margin-bottom:20px; border-bottom:1px dashed rgba(139,107,27,0.25); padding-bottom:12px;">
<p style="font-weight:bold; color:var(--color-gold-dark); margin-bottom:4px;">{{t.result.tpl08|tpl}}</p>
<p style="font-size:1.15rem; font-weight:700; color:var(--color-text-dark); margin-left:8px;">${result.moonSign || '-'}</p>
</div>

<div style="margin-bottom:20px; border-bottom:1px dashed rgba(139,107,27,0.25); padding-bottom:12px;">
<p style="font-weight:bold; color:var(--color-gold-dark); margin-bottom:4px;">{{t.result.tpl09|tpl}}</p>
<p style="font-size:1.15rem; font-weight:700; color:var(--color-text-dark); margin-left:8px;">${result.nakshatra || '-'}</p>
</div>

<div style="margin-bottom:24px;">
<p style="font-weight:bold; color:var(--color-gold-dark); margin-bottom:6px;">{{t.result.tpl10|tpl}}</p>
<p style="color:#4a3e36; line-height:1.7; text-align:justify; margin-left:8px;">${fr.horoscope || '-'}</p>
</div>

<div style="margin-bottom:24px;">
<p style="font-weight:bold; color:var(--color-gold-dark); margin-bottom:6px;">{{t.result.tpl11|tpl}}</p>
<p style="color:#4a3e36; line-height:1.7; text-align:justify; margin-left:8px;">${fr.influence || '-'}</p>
</div>

<div style="margin-bottom:24px;">
<p style="font-weight:bold; color:var(--color-gold-dark); margin-bottom:6px;">{{t.result.tpl12|tpl}}</p>
<p style="color:#4a3e36; line-height:1.7; text-align:justify; margin-left:8px;">${fr.dasha_summary || '-'}</p>
</div>

<div style="margin-top:25px; padding:15px; background:rgba(139,107,27,0.06); border:1px dashed var(--color-gold-main); border-radius:8px; text-align:center; font-weight:bold; color:var(--color-gold-dark);">
④ ${fr.lucky_element || '{{t.result.js10|js}}'}
</div>
`;
}

document.getElementById('content-area').innerHTML = `
${input ? `<div class="meta-card">✉️ {{t.result.metaEmail|tpl}}${input.email || '{{t.result.metaUnset|js}}'}<br>📅 {{t.result.metaDob|tpl}}${input.dob} ${input.tob || ''} | 📍 {{t.result.metaCity|tpl}}${input.address || input.city}</div>` : ''}
<div class="result-body">${readingContent}</div>
${result.geo_notice ? `<p style="margin:12px 4px 0; font-size:0.78rem; color:#6b5b4a; line-height:1.6;">${result.geo_notice}</p>` : ''}
${result.status === 'paid' ? '' : buildLockedPreview()}
<div class="cta-card">
<h3 style="color:var(--color-gold-dark); margin-bottom:8px;">{{t.result.tpl13|tpl}}</h3>
<p style="font-size:0.85rem; color:#5A4E48; margin-bottom:15px;">{{t.result.tpl14|tpl}}</p>
<a href="/{{lang}}/mypage" class="btn-primary">{{t.result.tpl15|tpl}}</a>
</div>
`;

window.LJCheckout.paint();

const upgradeBtn = document.getElementById('btn-upgrade-preview');
if (upgradeBtn) {
upgradeBtn.addEventListener('click', () => {
const email = (input && input.email) || localStorage.getItem('lj_user_email') || '';
window.open(`${premiumUpgradeUrl()}?prefilled_email=${encodeURIComponent(email)}`, '_blank');
});
}
}

// 無料鑑定との差が伝わるよう、有料会員に開放される項目をサンプル表示＋ぼかしで見せる
function buildLockedPreview() {
return `
<div class="locked-section">
<div class="locked-section-title">{{t.result.tpl16|tpl}}</div>
<p class="locked-section-lead">{{t.result.tpl17|tpl}}</p>
<div class="locked-wrapper">
<div>
<div class="preview-card">
<div class="preview-title">{{t.result.tpl18|tpl}}</div>
<table class="preview-table blur-content">
<thead><tr><th>{{t.result.tpl19|tpl}}</th><th>{{t.result.tpl20|tpl}}</th><th>{{t.result.tpl21|tpl}}</th><th>{{t.result.tpl22|tpl}}</th></tr></thead>
<tbody>
<tr><td>{{t.result.tpl23|tpl}}</td><td>{{t.result.tpl24|tpl}}</td><td>{{t.result.tpl25|tpl}}</td><td>{{t.result.tpl26|tpl}}</td></tr>
<tr><td>{{t.result.tpl27|tpl}}</td><td>{{t.result.tpl28|tpl}}</td><td>{{t.result.tpl29|tpl}}</td><td>{{t.result.tpl30|tpl}}</td></tr>
<tr><td>{{t.result.tpl31|tpl}}</td><td>{{t.result.tpl32|tpl}}</td><td>{{t.result.tpl33|tpl}}</td><td>{{t.result.tpl34|tpl}}</td></tr>
</tbody>
</table>
</div>
<div class="preview-card">
<div class="preview-title">{{t.result.tpl35|tpl}}</div>
<p class="preview-text blur-content">{{t.result.tpl36|tpl}}</p>
</div>
<div class="preview-card">
<div class="preview-title">{{t.result.tpl37|tpl}}</div>
<p class="preview-text blur-content">{{t.result.tpl38|tpl}}</p>
</div>
<div class="preview-card">
<div class="preview-title">{{t.result.tpl39|tpl}}</div>
<p class="preview-text blur-content">{{t.result.tpl40|tpl}}</p>
</div>
</div>
<div class="lock-overlay">
<div class="lock-icon">🔒</div>
<div class="lock-title">{{t.result.tpl41|tpl}}</div>
<p class="lock-note">{{t.result.tpl42|tpl}}</p>
<p data-price-label="premium" style="font-size:0.9rem; font-weight:700; color:var(--color-gold-dark); margin-bottom:12px;"></p>
<button type="button" id="btn-upgrade-preview" class="btn-primary" style="width:auto; padding:12px 24px;">{{t.result.tpl43|tpl}}</button>
<a href="/{{lang}}/pdf-purchase" class="btn-secondary" style="width:auto; padding:8px 18px; margin-top:12px;">{{t.result.tpl44|tpl}}</a>
</div>
</div>
</div>
`;
}
</script>
</body>
</html>
