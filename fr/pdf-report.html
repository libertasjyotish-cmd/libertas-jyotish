<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rapport de vie | Libertas Jyotish</title>
  <link rel="canonical" href="https://www.libertas-jyotish.com/fr/pdf-report">
  <link rel="alternate" hreflang="ja" href="https://www.libertas-jyotish.com/ja/pdf-report">
<link rel="alternate" hreflang="en" href="https://www.libertas-jyotish.com/en/pdf-report">
<link rel="alternate" hreflang="es" href="https://www.libertas-jyotish.com/es/pdf-report">
<link rel="alternate" hreflang="pt" href="https://www.libertas-jyotish.com/pt/pdf-report">
<link rel="alternate" hreflang="ar" href="https://www.libertas-jyotish.com/ar/pdf-report">
<link rel="alternate" hreflang="id" href="https://www.libertas-jyotish.com/id/pdf-report">
<link rel="alternate" hreflang="fr" href="https://www.libertas-jyotish.com/fr/pdf-report">
<link rel="alternate" hreflang="de" href="https://www.libertas-jyotish.com/de/pdf-report">
<link rel="alternate" hreflang="x-default" href="https://www.libertas-jyotish.com/pdf-report">
  <meta name="robots" content="noindex">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0c1a1f">
  <link rel="icon" type="image/png" href="/img/libertas-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Noto+Serif:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    /* 背景画像はここだけを差し替えれば全ページに反映される */
    :root {
      --cover-bg: url("/img/report-cover.jpg");
      --chapter-bg: url("/img/report-cover.jpg");
      --chapter-bg-opacity: 0.07;
      --logo: url("/img/libertas-logo.png");
      --color-gold-main: #D4AF37;
      --color-gold-dark: #8B6B1B;
      --color-ink: #2C221E;
      --color-paper: #FFFDF7;
      --font-en: 'Cinzel', serif;
      --font-ja: 'Noto Serif', serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-ja); color: var(--color-ink); line-height: 1.9;
      background: #0c1a1f;
    }
    .toolbar {
      position: fixed; top: 0; left: 0; width: 100%; z-index: 100;
      background: rgba(12, 26, 31, 0.94); border-bottom: 1px solid rgba(139, 107, 27, 0.3);
      padding: 10px 18px; display: flex; justify-content: space-between; align-items: center;
    }
    .toolbar a { color: #E2D9CE; text-decoration: none; font-size: 0.82rem; }
    .toolbar .brand { color: var(--color-gold-main); font-family: var(--font-en); }
    .btn {
      padding: 9px 18px; font-family: var(--font-ja); font-size: 0.85rem; color: #FFFDF9; cursor: pointer;
      background: linear-gradient(135deg, #C59B27 0%, var(--color-gold-dark) 100%);
      border: none; border-radius: 6px;
    }

    .book { max-width: 820px; margin: 0 auto; padding: 70px 0 60px; }
    .page {
      position: relative; background: var(--color-paper); padding: 46px 46px 52px; margin-bottom: 22px;
      border: 1px solid rgba(184, 142, 60, 0.5); border-radius: 6px;
      box-shadow: 0 18px 40px -18px rgba(0, 0, 0, 0.7);
    }
    /* 章扉の背景は薄く敷き、本文の可読性を落とさない */
    .page::before {
      content: ''; position: absolute; inset: 0; border-radius: 6px; pointer-events: none;
      background-image: var(--chapter-bg); background-size: cover; background-position: center;
      opacity: var(--chapter-bg-opacity);
    }
    .page > * { position: relative; }

    .cover {
      min-height: 1000px; text-align: center; color: #3a2f14;
      background-image: linear-gradient(rgba(255, 253, 247, 0.35), rgba(255, 253, 247, 0.55)), var(--cover-bg);
      background-size: cover; background-position: center;
      display: flex; flex-direction: column; justify-content: space-between;
    }
    .cover::before { content: none; }
    .cover .logo { width: 68px; margin: 0 auto; }
    .cover h1 { font-family: var(--font-en); font-size: 2.1rem; letter-spacing: 0.14em; color: var(--color-gold-dark); }
    .cover .sub { font-size: 1.15rem; letter-spacing: 0.3em; margin-top: 10px; }
    .cover .owner { font-size: 0.95rem; line-height: 2.2; }

    h2.chapter-title {
      font-size: 1.35rem; color: var(--color-gold-dark); letter-spacing: 0.06em;
      border-bottom: 1px solid rgba(139, 107, 27, 0.35); padding-bottom: 10px; margin-bottom: 22px;
    }
    h3 { font-size: 1rem; color: var(--color-gold-dark); margin: 22px 0 8px; }
    p { font-size: 0.94rem; margin-bottom: 12px; text-align: justify; }
    ul { margin: 6px 0 12px 1.2em; font-size: 0.94rem; }

    .lead { font-size: 1.5rem; line-height: 1.7; color: var(--color-gold-dark); text-align: center; margin: 10px 0 26px; }
    .toc li { margin-bottom: 6px; }

    .fact {
      background: rgba(212, 175, 55, 0.09); border-left: 3px solid var(--color-gold-main);
      padding: 12px 16px; margin: 14px 0; font-size: 0.9rem;
    }
    .fact .reason { display: block; font-size: 0.8rem; color: #6A5E58; margin-top: 4px; }

    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; margin: 12px 0; }
    th, td { border: 1px solid rgba(139, 107, 27, 0.3); padding: 7px 9px; text-align: left; }
    th { background: rgba(212, 175, 55, 0.14); color: var(--color-gold-dark); font-weight: 600; }

    .bar-row { display: grid; grid-template-columns: 7em 1fr 3.4em; align-items: center; gap: 10px; margin-bottom: 6px; font-size: 0.85rem; }
    .bar { height: 12px; background: rgba(139, 107, 27, 0.15); border-radius: 6px; overflow: hidden; }
    .bar span { display: block; height: 100%; background: linear-gradient(90deg, #D4AF37, #8B6B1B); }

    .chart-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .chart-box { border: 1px solid rgba(139, 107, 27, 0.3); background: #fff; padding: 10px; text-align: center; }
    .chart-box svg, .chart-box img { max-width: 100%; height: auto; }
    .chart-box figcaption { font-size: 0.8rem; color: #6A5E58; margin-top: 6px; }

    .color-chip { display: inline-block; width: 16px; height: 16px; border-radius: 3px; border: 1px solid rgba(0,0,0,0.2); vertical-align: -3px; margin-right: 6px; }
    .disclaimer { font-size: 0.78rem; color: #6A5E58; line-height: 1.9; }
    .palm-photos { display: flex; gap: 14px; justify-content: center; margin: 10px 0 14px; }
    .palm-photo { position: relative; flex: 1 1 0; max-width: 48%; }
    .palm-photo img { display: block; width: 100%; height: auto; border-radius: 8px; border: 1px solid #C9B79C; }
    .palm-photo .cap { text-align: center; font-size: 0.8rem; color: #6A5E58; margin-top: 4px; }
    .palm-photo .pin { position: absolute; transform: translate(-50%, -50%); width: 22px; height: 22px; border-radius: 50%; background: #7A1E1E; color: #fff; font-size: 0.72rem; font-weight: bold; line-height: 22px; text-align: center; border: 2px solid #fff; box-shadow: 0 0 0 1px #7A1E1E; }
    .palm-legend { columns: 2; font-size: 0.82rem; line-height: 1.8; }
    .palm-legend li { break-inside: avoid; }
    .palm-legend .n { display: inline-block; min-width: 20px; height: 20px; border-radius: 50%; background: #7A1E1E; color: #fff; font-size: 0.7rem; line-height: 20px; text-align: center; margin-inline-end: 6px; }

    .status { color: #E2D9CE; text-align: center; padding: 140px 24px; font-size: 0.95rem; }
    .status a { color: var(--color-gold-main); }

    @media (max-width: 640px) {
      .page { padding: 26px 20px 32px; }
      .chart-grid { grid-template-columns: 1fr; }
    }

    @media print {
      @page { size: A4; margin: 14mm; }
      body { background: #fff; }
      .toolbar, .status { display: none !important; }
      .book { max-width: 100%; padding: 0; }
      .page {
        margin: 0; border: none; border-radius: 0; box-shadow: none; padding: 0 0 12mm;
        page-break-after: always; break-after: page;
      }
      .page:last-child { page-break-after: auto; break-after: auto; }
      .cover { min-height: 245mm; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .fact, .bar-row, table, .chart-box { page-break-inside: avoid; break-inside: avoid; }
      h2.chapter-title, h3 { page-break-after: avoid; break-after: avoid; }
      * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
  </style>
  <link rel="stylesheet" href="/css/rtl.css">
</head>
<body>

  <div class="toolbar">
    <a href="/fr" class="brand">Libertas Jyotish</a>
    <div>
      <span id="progress" style="color:#E2D9CE; font-size:0.78rem; margin-right:16px;"></span>
      <a href="/fr/mypage" style="margin-right:16px;">Espace membre</a>
      <button class="btn" id="btn-print">Enregistrer ou imprimer en PDF</button>
    </div>
  </div>

  <div id="status" class="status">Chargement de votre rapport...</div>
  <div class="book" id="book" style="display:none;"></div>

  <script>
    const API_URL = '/api/pdf-report';
    const statusEl = document.getElementById('status');
    const bookEl = document.getElementById('book');

    const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, (c) => (
      { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
    ));
    const para = (text) => (text ? String(text).split(/\n{1,}/).map((t) => `<p>${esc(t)}</p>`).join('') : '');
    const page = (inner) => `<section class="page">${inner}</section>`;

    document.getElementById('btn-print').addEventListener('click', () => window.print());

    function setStatus(html) {
      statusEl.innerHTML = html;
      statusEl.style.display = 'block';
    }

    async function requestReport(email, session) {
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email,
          session,
          dob: localStorage.getItem('dob') || '',
          tob: localStorage.getItem('tob') || '',
          city: localStorage.getItem('city') || '',
          language: 'fr'
        })
      });

      if (res.status === 401) {
        localStorage.removeItem('lj_session');
        throw new Error('Votre session a expiré.<br><a href=\"/fr/mypage?next=pdf-report\">Connectez-vous à nouveau pour ouvrir votre rapport</a>');
      }
      if (res.status === 403) throw new Error('Ce rapport est réservé aux acheteurs.<br><a href=\"/fr/pdf-purchase\">À propos du Rapport de vie</a>');
      if (!res.ok) {
        const detail = await res.json().catch(() => ({}));
        throw new Error(detail.error === 'missing_birth_data'
          ? 'Aucune donnée de naissance n\'est enregistrée.<br>Veuillez enregistrer votre date et lieu de naissance sur votre <a href=\"/fr/mypage\">espace membre</a>.'
          : 'Nous n\'avons pas pu préparer votre rapport. Veuillez recharger la page dans quelques instants.');
      }
      return res.json();
    }

    async function load() {
      const email = localStorage.getItem('lj_user_email');
      const session = localStorage.getItem('lj_session');
      if (!email) {
        setStatus('Vous devez vous connecter pour lire votre rapport.<br>Veuillez <a href=\"/fr/mypage\">vous connecter depuis votre espace membre</a>.');
        return;
      }
      // Google ログインだと本人確認セッションが無いため、マイページでメール認証してここに戻す
      if (!session) {
        setStatus('Redirection vers la vérification d\'identité, où vous confirmerez le code que nous vous avons envoyé par e-mail...');
        window.location.href = '/fr/mypage?next=pdf-report';
        return;
      }

      // 未生成の章はサーバ側で分割生成されるため、pending がなくなるまで繰り返す
      let attempt = 0;
      let rendered = false;
      while (attempt < 6) {
        attempt += 1;
        let data;
        try {
          data = await requestReport(email, session);
        } catch (err) {
          if (rendered) return;
          setStatus(err.message || 'La connexion a échoué. Veuillez recharger la page dans quelques instants.');
          return;
        }

        render(data);
        statusEl.style.display = 'none';
        bookEl.style.display = 'block';
        rendered = true;

        const progressEl = document.getElementById('progress');
        if (!data.pending || !data.pending.length) {
          progressEl.textContent = '';
          return;
        }
        progressEl.textContent = `Rédaction des ${data.pending.length} chapitres restants...`;
      }
    }

    function render(data) {
      const a = data.astro || {};
      const c = data.chapters || {};
      if (a.product === 'yearly' || a.product === 'compat' || a.product === 'career' || a.product === 'palm') {
        bookEl.innerHTML = renderProduct(a, c, data);
        return;
      }
      const html = [];

      html.push(cover(a));
      html.push(toc());
      if (c.summary) html.push(summaryPage(c.summary, a));
      if (c.ch1) html.push(page(`<h2 class="chapter-title">${esc(c.ch1.title)}</h2>
        <h3>Lagna — le vous que les autres perçoivent</h3>${para(c.ch1.lagna)}
        <h3>Lune — le vous intérieur</h3>${para(c.ch1.moon)}
        <h3>Soleil — la direction que vous visez</h3>${para(c.ch1.sun)}
        <h3>Comment ces trois dimensions s'entremêlent</h3>${para(c.ch1.integration)}`));
      if (c.ch2) html.push(strengthPage(c.ch2, a));
      if (c.ch3) html.push(yogaPage(c.ch3, a));
      if (c.ch4) html.push(monoPage(c.ch4, a));
      if (c.ch5) html.push(kotoPage(c.ch5, a));
      if (c.ch6) html.push(bashoPage(c.ch6, a));
      if (c.ch7) html.push(page(`<h2 class="chapter-title">${esc(c.ch7.title)}</h2>
        <div class="fact">Votre style de travail : <strong>${esc(c.ch7.type)}</strong>
          <span class="reason">${esc(a.boosters?.koto?.workStyle?.reason || '')}</span></div>
        ${para(c.ch7.text)}
        <h3>Les environnements où vous vous épanouissez</h3>${para(c.ch7.environment)}
        <h3>Les méthodes de travail qui vous épuisent</h3>${para(c.ch7.caution)}`));
      if (c.ch8) html.push(wealthPage(c.ch8, a));
      if (c.ch9) html.push(timelinePage(c.ch9, a));
      if (c.ch10) html.push(nowPage(c.ch10, a));
      if (c.ch11) html.push(futurePage(c.ch11, a));
      if (c.ch12) html.push(trialPage(c.ch12, a));
      html.push(chartsPage(a));
      html.push(planetsPage(a));
      html.push(disclaimerPage(data));

      bookEl.innerHTML = html.join('');
    }

    function cover(a) {
      const birth = `${esc(a.birth?.dob || '')} ${esc(a.birth?.tob || '')}`;
      return `<section class="page cover">
        <div><img class="logo" src="/img/libertas-logo.png" alt="Libertas Jyotish"></div>
        <div>
          <h1>Libertas Jyotish</h1>
          <div class="sub">Rapport de vie</div>
        </div>
        <div class="owner">
          Né(e) le  ${birth}<br>
          Lieu de naissance  ${esc(a.city || '')}<br>
          Lagna  ${esc(a.ascendant?.sign || '')}  /  Lune  ${esc(a.moon?.sign || '')}  /  ${esc(a.nakshatra || '')}
        </div>
      </section>`;
    }

    function toc() {
      const items = [
        'Votre mode d\'emploi, en un coup d\'œil',
        'Chapitre 1 Le plan qui vous définit',
        'Chapitre 2 La planète la plus forte en vous',
        'Chapitre 3 La bonne fortune avec laquelle vous êtes né',
        'Chapitre 4 Objets — pierres et couleurs',
        'Chapitre 5 Pratiques — habitudes et méthodes de travail',
        'Chapitre 6 Lieux — directions et environnements',
        'Chapitre 7 Votre vocation et comment utiliser vos talents',
        'Chapitre 8 Votre chemin vers l\'abondance',
        'Chapitre 9 La carte de votre destin (chronologie de vie)',
        'Chapitre 10 Où vous en êtes aujourd\'hui',
        'Chapitre 11 La période dorée à venir',
        'Chapitre 12 Transformer les épreuves en fondations',
        'Annexe Données'
      ];
      return page(`<h2 class="chapter-title">Sommaire</h2><ul class="toc">${items.map((t) => `<li>${esc(t)}</li>`).join('')}</ul>`);
    }

    function summaryPage(s, a) {
      const list = (arr) => (Array.isArray(arr) ? `<ul>${arr.filter(Boolean).map((v) => `<li>${esc(v)}</li>`).join('')}</ul>` : '');
      const dasha = a.dasha?.current?.maha;
      return page(`<h2 class="chapter-title">Votre mode d'emploi, en un coup d'œil</h2>
        <div class="lead">${esc(s.catchphrase)}</div>
        ${para(s.essence)}
        <h3>Les qualités qui sont vos atouts</h3>${list(s.weapons)}
        <h3>Les domaines avec une marge de progression</h3>${list(s.growth)}
        ${dasha ? `<div class="fact">Période majeure actuelle : ${esc(dasha.lordJa)} (${esc(dasha.start)} – ${esc(dasha.end)})
          <span class="reason">Calculé à partir de la Vimshottari Dasha</span></div>` : ''}
        ${para(s.now)}`);
    }

    function strengthPage(ch, a) {
      const rows = (a.strength || []).map((p) => `<div class="bar-row">
        <span>${esc(p.name)}（${esc(p.dignity)}）</span>
        <span class="bar"><span style="width:${Math.max(0, Math.min(100, p.score))}%"></span></span>
        <span>${esc(p.score)}</span></div>`).join('');
      const block = (arr) => (Array.isArray(arr) ? arr.map((i) => `<h3>${esc(i.planet)}</h3>${para(i.text)}`).join('') : '');
      return page(`<h2 class="chapter-title">${esc(ch.title)}</h2>
        ${para(ch.intro)}
        <h3>Force des neuf planètes</h3>${rows}
        <h3>Vos atouts</h3>${block(ch.strong)}
        <h3>Marge de progression</h3>${block(ch.weak)}
        ${para(ch.closing)}`);
    }

    function yogaPage(ch, a) {
      const items = (ch.items || []).map((y) => {
        const src = (a.yogas || []).find((v) => v.name === y.name);
        return `<div class="fact"><strong>${esc(y.name)}</strong>
          ${src?.group ? `<span class="reason">${esc(src.group)}</span>` : ''}</div>${para(y.text)}`;
      }).join('');
      return page(`<h2 class="chapter-title">${esc(ch.title)}</h2>${para(ch.intro)}${items}${para(ch.closing)}`);
    }

    function monoPage(ch, a) {
      const mono = a.boosters?.mono || {};
      const stone = mono.lifeStone;
      const colors = mono.colors || {};
      const chip = (c) => (c ? `<span class="color-chip" style="background:${esc(c.hex)}"></span>${esc(c.name)}` : '');
      return page(`<h2 class="chapter-title">${esc(ch.title)}</h2>
        ${stone ? `<div class="fact">Pierre de vie : <strong>${esc(stone.stone)}</strong>
          ${stone.alternatives?.length ? ` (alternatives : ${esc(stone.alternatives.join(', '))})` : ''}
          <span class="reason">${esc(stone.reason)}</span></div>` : ''}
        ${para(ch.stone)}
        ${mono.supportStone ? `<div class="fact">Pierre soutenant votre période actuelle : <strong>${esc(mono.supportStone.stone)}</strong>
          <span class="reason">${esc(mono.supportStone.reason)}</span></div>${para(ch.support)}` : ''}
        <h3>Votre couleur pour les moments décisifs</h3>
        <div class="fact">${chip(colors.main)}${colors.support ? `　／　${chip(colors.support)}` : ''}
          <span class="reason">${esc(colors.reason || '')}</span></div>
        ${para(ch.color)}
        <p class="disclaimer">${esc(ch.note || '')}</p>`);
    }

    function kotoPage(ch, a) {
      const koto = a.boosters?.koto || {};
      const list = (arr) => (Array.isArray(arr) ? `<ul>${arr.map((v) => `<li>${esc(v)}</li>`).join('')}</ul>` : '');
      return page(`<h2 class="chapter-title">${esc(ch.title)}</h2>
        ${koto.workStyle ? `<div class="fact">Votre style de travail : <strong>${esc(koto.workStyle.type)}</strong>　${esc(koto.workStyle.detail)}
          <span class="reason">${esc(koto.workStyle.reason)}</span></div>` : ''}
        ${para(ch.work)}
        <h3>Habitudes matinales</h3>${list(koto.rhythm?.morning)}${para(ch.morning)}
        <h3>Habitudes du soir</h3>${list(koto.rhythm?.night)}${para(ch.night)}
        <h3>Heures de concentration optimale</h3>
        ${koto.rhythm ? `<div class="fact">${esc(koto.rhythm.focus)}<span class="reason">${esc(koto.rhythm.reason)}</span></div>` : ''}
        ${para(ch.focus)}`);
    }

    function bashoPage(ch, a) {
      const b = a.boosters?.basho || {};
      const box = (d, label, text) => (d ? `<h3>${label}</h3>
        <div class="fact">Direction : <strong>${esc(d.direction)}</strong>  Environnement : ${esc((d.environment || []).join(', '))}
          <span class="reason">${esc(d.reason)}</span></div>${para(text)}` : '');
      return page(`<h2 class="chapter-title">${esc(ch.title)}</h2>
        ${box(b.primary, 'Votre direction naturelle', ch.primary)}
        ${box(b.career, 'Les environnements où vous êtes performant au travail', ch.career)}
        ${box(b.rest, 'Les environnements propices à la récupération', ch.rest)}`);
    }

    function wealthPage(ch, a) {
      const av = a.ashtakavarga;
      const rows = av ? av.houses.map((h) => `<div class="bar-row">
        <span>${esc(h.label)}</span>
        <span class="bar"><span style="width:${Math.max(0, Math.min(100, Math.round(h.score / 50 * 100)))}%"></span></span>
        <span>${esc(h.score)} pts</span></div>`).join('') : '';
      return page(`<h2 class="chapter-title">${esc(ch.title)}</h2>
        ${para(ch.intro)}
        ${av ? `<div class="fact">Les douze domaines totalisent 337 points, soit une moyenne de ${esc(av.average)} points.
          <span class="reason">Calculé à partir du Sarvashtakavarga</span></div>${rows}` : ''}
        <h3>Domaines forts</h3>${para(ch.strong)}
        <h3>Domaines à consolider</h3>${para(ch.weak)}
        <h3>Par où l'abondance entre</h3>${para(ch.money)}
        <h3>Comment organiser vos dépenses</h3>${para(ch.spending)}`);
    }

    function timelinePage(ch, a) {
      const map = new Map((ch.periods || []).map((p) => [p.lord, p.text]));
      const rows = (a.dasha?.timeline || []).map((t) => `<tr>
        <td>${esc(t.lordJa)} période</td><td>${esc(t.start)} – ${esc(t.end)}</td>
        <td>${esc(t.season)}${t.isCurrent ? ' (actuel)' : ''}</td>
        <td>${esc(map.get(t.lordJa) || map.get(t.lord) || '')}</td></tr>`).join('');
      return page(`<h2 class="chapter-title">${esc(ch.title)}</h2>
        ${para(ch.intro)}
        <table><thead><tr><th>Cycle</th><th>Période</th><th>Caractère</th><th>Thème</th></tr></thead><tbody>${rows}</tbody></table>
        <h3>Transitions jusqu'à présent</h3>${para(ch.past)}`);
    }

    function nowPage(ch, a) {
      const cur = a.dasha?.current;
      const list = (arr) => (Array.isArray(arr) ? `<ul>${arr.filter(Boolean).map((v) => `<li>${esc(v)}</li>`).join('')}</ul>` : '');
      const line = (label, d) => (d ? `${label}: ${esc(d.lordJa)} (${esc(d.start)} – ${esc(d.end)})<br>` : '');
      return page(`<h2 class="chapter-title">${esc(ch.title)}</h2>
        ${cur ? `<div class="fact">${line('Période majeure', cur.maha)}${line('Sous-période', cur.antar)}${line('Période mineure', cur.pratyantar)}
          <span class="reason">Calculé à partir du Vimshottari Dasha</span></div>` : ''}
        ${para(ch.text)}
        <h3>Ce qui est favorable durant cette période</h3>${list(ch.todo)}
        <h3>Décisions à éviter</h3>${list(ch.avoid)}`);
    }

    function futurePage(ch, a) {
      const rows = (a.dasha?.upcoming || []).map((u) => `<tr>
        <td>${esc(u.maha)} / ${esc(u.antar)}</td><td>${esc(u.start)} 〜 ${esc(u.end)}</td></tr>`).join('');
      const blocks = (ch.periods || []).map((p) => `<h3>${esc(p.label)}</h3>${para(p.text)}`).join('');
      return page(`<h2 class="chapter-title">${esc(ch.title)}</h2>
        ${para(ch.intro)}
        <table><thead><tr><th>Période majeure / sous-période</th><th>Période</th></tr></thead><tbody>${rows}</tbody></table>
        ${blocks}${para(ch.closing)}`);
    }

    function trialPage(ch, a) {
      const ss = a.sadeSati;
      const rows = ss?.transits?.length ? `<table><thead><tr><th>Phase</th><th>Position de Saturne</th><th>Période</th></tr></thead><tbody>
        ${ss.transits.map((t) => `<tr><td>${esc(t.phase)}</td><td>${esc(t.sign)}</td><td>${esc(t.start)} 〜 ${esc(t.end)}</td></tr>`).join('')}
        </tbody></table>` : '';
      const list = (arr) => (Array.isArray(arr) ? `<ul>${arr.filter(Boolean).map((v) => `<li>${esc(v)}</li>`).join('')}</ul>` : '');
      return page(`<h2 class="chapter-title">${esc(ch.title)}</h2>
        ${para(ch.intro)}
        <h3>Sade Sati (période d'ajustement de Saturne)</h3>
        ${ss ? `<div class="fact">Applicable : ${ss.active ? 'Oui' : 'Non'}${ss.phase ? ` (${esc(ss.phase)})` : ''}
          <span class="reason">Calculé à partir du Sade Sati</span></div>` : ''}
        ${rows}${para(ch.sadeSati)}
        <h3>Mangal Dosha (un placement fort de Mars)</h3>
        ${a.mangalDosha ? `<div class="fact">Applicable : ${a.mangalDosha.hasDosha ? 'Oui' : 'Non'}
          <span class="reason">Évalué à partir du Mangal Dosha</span></div>` : ''}
        ${para(ch.mangal)}
        <h3>Ce que vous pouvez commencer aujourd'hui</h3>${list(ch.actions)}
        ${para(ch.closing)}`);
    }

    function chartsPage(a) {
      const box = (svg, caption) => (svg ? `<figure class="chart-box">${svg}<figcaption>${esc(caption)}</figcaption></figure>` : '');
      const charts = a.charts || {};
      return page(`<h2 class="chapter-title">Annexe : Thèmes</h2>
        <div class="chart-grid">
          ${box(charts.d1, 'D1 Rashi (la vie dans son ensemble)')}
          ${box(charts.d9, 'D9 Navamsha (seconde partie de vie, partenaire)')}
          ${box(charts.d10, 'D10 Dashamsha (travail, société)')}
        </div>
        <p class="disclaimer">Les thèmes suivent le style de l'Inde du Nord. Le numéro dans chaque section correspond au numéro de la maison, et les symboles représentent les planètes qui s'y trouvent.</p>`);
    }

    function planetsPage(a) {
      const dignity = new Map((a.strength || []).map((s) => [s.key, s.dignity]));
      const rows = (a.planets || []).map((p) => `<tr>
        <td>${esc(p.name)}</td><td>${esc(p.sign)}</td><td>${p.degree == null ? '' : esc(p.degree)}</td>
        <td>${p.house == null ? '' : esc(p.house)}</td><td>${esc(p.nakshatra)}</td>
        <td>${p.retrograde ? 'Rétrograde' : ''}</td><td>${esc(dignity.get(p.key) || '')}</td></tr>`).join('');
      return page(`<h2 class="chapter-title">Annexe : Données planétaires</h2>
        <table><thead><tr><th>Planète</th><th>Signe</th><th>Degré</th><th>Maison</th><th>Nakshatra</th><th>Rétrograde</th><th>Dignité</th></tr></thead>
        <tbody>${rows}</tbody></table>`);
    }

    // --- 年間運勢・相性鑑定: 章スキーマが商品ごとに異なるため、値の型に応じて汎用的に描く ---
    const PROD_ORDER = ['summary', 'ch1', 'ch2', 'ch3', 'ch4', 'ch5', 'ch6', 'ch7', 'ch8', 'ch9', 'ch10'];
    const list = (arr) => `<ul>${arr.filter(Boolean).map((v) => `<li>${esc(v)}</li>`).join('')}</ul>`;

    function genericValue(v) {
      if (v == null || v === '') return '';
      if (typeof v === 'string') return para(v);
      if (Array.isArray(v)) {
        if (!v.length) return '';
        if (typeof v[0] === 'string') return list(v);
        return v.map((item) => {
          const head = item.month || item.name || item.planet || item.label || item.mark || item.feature || item.step || '';
          const sub = item.phase || item.theme || item.title || item.kind || item.where || '';
          const used = new Set(['month', 'name', 'planet', 'label', 'mark', 'feature', 'step', 'phase', 'theme', 'title', 'kind', 'where', 'todo']);
          const body = Object.entries(item).filter(([k, val]) => !used.has(k) && typeof val === 'string' && val).map(([, val]) => para(val)).join('');
          const todo = item.todo ? `<ul><li>${esc(item.todo)}</li></ul>` : '';
          return `<div class="fact"><strong>${esc(head)}</strong>${sub ? `　${esc(sub)}` : ''}</div>${body}${todo}`;
        }).join('');
      }
      if (typeof v === 'object') return Object.values(v).map(genericValue).join('');
      return para(String(v));
    }

    function genericPage(ch) {
      const parts = [];
      for (const [key, v] of Object.entries(ch)) {
        if (key === 'title') continue;
        if (key === 'catchphrase') { parts.push(`<div class="lead">${esc(v)}</div>`); continue; }
        parts.push(genericValue(v));
      }
      return page(`<h2 class="chapter-title">${esc(ch.title)}</h2>${parts.join('')}`);
    }

    function personLine(p) {
      if (!p) return '';
      const b = p.birth || {};
      return `${esc(b.dob || '')} ${esc(b.tob || '')}${p.city ? ` · ${esc(p.city)}` : ''}<br>
        Lagna  ${esc(p.ascendant?.sign || '')}  /  Lune  ${esc(p.moon?.sign || '')}  /  ${esc(p.nakshatra || '')}`;
    }

    function productCover(a) {
      const sub = a.product === 'yearly' ? 'Prévisions annuelles (les 12 prochains mois)'
        : a.product === 'career' ? 'Rapport de carrière, vocation et richesse (Votre vocation)'
        : a.product === 'palm' ? 'Kar-Kundali : Rapport de chiromancie védique et thème astral'
        : 'Rapport de compatibilité';
      const owner = a.product === 'yearly'
        ? `${esc(a.period?.start || '')} — ${esc(a.period?.end || '')}<br>${personLine(a)}`
        : a.product === 'career' || a.product === 'palm' ? personLine(a)
        : `<strong>A</strong> ${personLine(a.personA)}<br><br><strong>B</strong> ${personLine(a.personB)}`;
      return `<section class="page cover">
        <div><img class="logo" src="/img/libertas-logo.png" alt="Libertas Jyotish"></div>
        <div><h1>Libertas Jyotish</h1><div class="sub">${sub}</div></div>
        <div class="owner">${owner}</div>
      </section>`;
    }

    function yearlyDataPage(a) {
      const rows = (a.months || []).map((m) => `<tr><td>${esc(m.month)}</td>${m.planets.filter((p) => ['Sun', 'Mars', 'Jupiter', 'Saturn', 'Rahu', 'Ketu', 'Venus'].includes(p.key)).map((p) => `<td>${esc(p.sign)}${p.houseFromMoon ? ` (${esc(p.houseFromMoon)})` : ''}${p.retrograde ? 'Rétrograde' : ''}</td>`).join('')}</tr>`).join('');
      const first = (a.months || [])[0];
      const heads = first ? first.planets.filter((p) => ['Sun', 'Mars', 'Jupiter', 'Saturn', 'Rahu', 'Ketu', 'Venus'].includes(p.key)).map((p) => `<th>${esc(p.name)}</th>`).join('') : '';
      return page(`<h2 class="chapter-title">Positions planétaires mensuelles</h2>
        <table><thead><tr><th>Mois</th>${heads}</tr></thead><tbody>${rows}</tbody></table>
        <p class="disclaimer">Les nombres entre parenthèses correspondent aux maisons comptées à partir de votre Lune natale. Le R indique un mouvement rétrograde.</p>`);
    }

    function compatDataPage(a) {
      const col = (p) => (p.planets || []).map((pl) => `<tr><td>${esc(pl.name)}</td><td>${esc(pl.sign)}</td><td>${pl.house == null ? '' : esc(pl.house)}</td><td>${esc(pl.nakshatra)}</td></tr>`).join('');
      const table = (p, label) => `<h3>${label}</h3><table><thead><tr><th>Planète</th><th>Signe</th><th>Maison</th><th>Nakshatra</th></tr></thead><tbody>${col(p)}</tbody></table>`;
      const m = a.matching || {};
      const kootas = (m.kootas || []).length && a.relation === 'romance'
        ? `<h3>Total Ashtakoota ${esc(m.total)} / ${esc(m.max)}</h3><table><tbody>${m.kootas.map((k) => `<tr><td>${esc(k.name)}</td><td>${esc(k.points)} / ${esc(k.max)}</td></tr>`).join('')}</tbody></table>`
        : '';
      return page(`<h2 class="chapter-title">Annexe : Données planétaires</h2>${table(a.personA || {}, 'A')}${table(a.personB || {}, 'B')}${kootas}`);
    }

    function careerDataPage(a) {
      const houses = (a.careerHouses || []).map((h) => `<tr><td>${esc(h.house)}</td><td>${esc(h.label)}</td><td>${esc(h.sign)}</td>
        <td>${esc(h.lord)}${h.lordPlacedIn ? ` → ${esc(h.lordPlacedIn.label)}${h.lordPlacedIn.dignity ? ` (${esc(h.lordPlacedIn.dignity)})` : ''}` : ''}</td>
        <td>${(h.occupants || []).map((o) => `${esc(o.planet)}${o.retrograde ? 'Rétrograde' : ''}`).join(', ')}</td></tr>`).join('');
      const rows = (a.careerTransits || []).map((m) => `<tr><td>${esc(m.month)}</td>${m.planets.map((p) => `<td>${esc(p.sign)} (${esc(p.houseFromLagna)})${p.retrograde ? 'Rétrograde' : ''}</td>`).join('')}</tr>`).join('');
      const first = (a.careerTransits || [])[0];
      const heads = first ? first.planets.map((p) => `<th>${esc(p.name)}</th>`).join('') : '';
      return page(`<h2 class="chapter-title">Maisons du travail et de l'argent</h2>
        <table><thead><tr><th>Maison</th><th>Thème</th><th>Signe</th><th>Maître (→ placé en)</th><th>Planètes dans la maison</th></tr></thead><tbody>${houses}</tbody></table>
        <h3>Positions planétaires mensuelles</h3>
        <table><thead><tr><th>Mois</th>${heads}</tr></thead><tbody>${rows}</tbody></table>
        <p class="disclaimer">Les nombres entre parenthèses correspondent aux maisons comptées à partir de votre ascendant (1ère maison). Le R indique un mouvement rétrograde.</p>`);
    }

    // 手相×出生図: 写真から読み取った「形」の一覧（観察データ。解釈は含まない）
    function palmDataPage(a) {
      const p = a.palm || {};
      const hands = p.hands || {};
      const cell = (v) => esc(v == null || v === '' ? '—' : String(v).replace(/_/g, ' '));
      const rowPair = (label, r, l) => `<tr><td>${esc(label)}</td><td>${cell(r)}</td><td>${cell(l)}</td></tr>`;
      const head = `<thead><tr><th></th><th>Main droite${a.hand === 'right' ? ' *' : ''}</th><th>Main gauche${a.hand === 'left' ? ' *' : ''}</th></tr></thead>`;
      const R = hands.right || {}, L = hands.left || {};
      const terms = a.palmTerms || { lines: {}, mounts: {}, marks: {} };
      const rows = [
        rowPair('Netteté de la photo', p.image_quality?.right, p.image_quality?.left),
        rowPair('Forme de la main', R.hand_shape, L.hand_shape),
        ...Object.keys(R.mounts || {}).map((m) => rowPair(`◎ ${terms.mounts[m] || m}`, R.mounts?.[m], L.mounts?.[m])),
        ...Object.keys(R.lines || {}).map((ln) => rowPair(`― ${terms.lines[ln] || ln}`, `${R.lines?.[ln]?.clarity || ''} / ${R.lines?.[ln]?.length || ''}`, `${L.lines?.[ln]?.clarity || ''} / ${L.lines?.[ln]?.length || ''}`))
      ].join('');
      const marks = (side, h) => (h.marks || []).map((m) => `<li>${esc(side)}: ${cell(terms.marks[m.type] || m.type)} — ${esc(m.location)} (${esc(m.confidence)})</li>`).join('');
      const markList = marks('R', R) + marks('L', L);
      const unclear = (p.unclear || []).length ? `<p class="disclaimer">${esc(p.unclear.join(' / '))}</p>` : '';
      return page(`<h2 class="chapter-title">Observations des paumes (caractéristiques lues à partir de vos photos)</h2>
        <table>${head}<tbody>${rows}</tbody></table>
        ${markList ? `<h3>Marques trouvées</h3><ul>${markList}</ul>` : ''}
        ${unclear}
        <p class="disclaimer">* main dominante. Ce tableau liste les caractéristiques qu'une IA a lues mécaniquement à partir de vos photos ; les interprétations basées sur les correspondances traditionnelles du Hasta Samudrika se trouvent dans les chapitres. Les photos originales sont supprimées 30 jours après la livraison et ne sont jamais utilisées à des fins d'identification ou de biométrie. Ne convient pas pour évaluer l'état de santé.</p>`);
    }

    // 手相×出生図: 写真に番号ラベルを重ねて、読み取った線・印の位置（Vision の at: 百分率）を正式名称で示す。
    // 写真 URL が無い（古い注文・削除後）や位置情報が無い場合はページごと省く。
    function palmPhotoPage(a) {
      const photos = a.photos || {};
      const terms = a.palmTerms || { lines: {}, marks: {}, hands: {} };
      const hands = (a.palm && a.palm.hands) || {};
      const sides = ['right', 'left'].filter((s) => photos[s]);
      if (!sides.length) return '';
      let n = 0;
      const legend = [];
      const blocks = sides.map((side) => {
        const h = hands[side] || {};
        const pins = [];
        for (const [key, ln] of Object.entries(h.lines || {})) {
          if (!ln || !ln.at) continue;
          n += 1;
          pins.push({ n, at: ln.at });
          legend.push(`<li><span class="n">${n}</span>${esc(terms.hands[side] || side)}: ${esc(terms.lines[key] || key)}</li>`);
        }
        for (const m of h.marks || []) {
          if (!m || !m.at) continue;
          n += 1;
          pins.push({ n, at: m.at });
          legend.push(`<li><span class="n">${n}</span>${esc(terms.hands[side] || side)}: <strong>${esc(terms.marks[m.type] || m.type)}</strong></li>`);
        }
        const pinHtml = pins.map((p) => `<span class="pin" style="left:${p.at.x}%;top:${p.at.y}%">${p.n}</span>`).join('');
        return `<div class="palm-photo"><img src="${esc(photos[side])}" alt="">${pinHtml}<div class="cap">${esc(terms.hands[side] || side)}${a.hand === side ? ' *' : ''}</div></div>`;
      });
      if (!n) return '';
      return page(`<h2 class="chapter-title">Vos mains (lignes et marques telles que lues)</h2>
        <div class="palm-photos">${blocks.join('')}</div>
        <ul class="palm-legend">${legend.join('')}</ul>
        <p class="disclaimer">Les numéros indiquent la position approximative de chaque ligne ou marque lue sur la photo ; l'angle et l'éclairage peuvent les décaler légèrement. Les photos sont supprimées 30 jours après la livraison.</p>`);
    }

    function renderProduct(a, c, data) {
      const chapters = PROD_ORDER.map((id) => c[id]).filter(Boolean);
      const html = [productCover(a)];
      html.push(page(`<h2 class="chapter-title">Sommaire</h2><ul class="toc">${chapters.map((ch) => `<li>${esc(ch.title)}</li>`).join('')}</ul>`));
      for (const ch of chapters) html.push(genericPage(ch));
      if (a.product === 'career') { html.push(careerDataPage(a)); html.push(chartsPage(a)); html.push(planetsPage(a)); }
      else if (a.product === 'palm') { html.push(palmPhotoPage(a)); html.push(palmDataPage(a)); html.push(chartsPage(a)); html.push(planetsPage(a)); }
      else html.push(a.product === 'yearly' ? yearlyDataPage(a) : compatDataPage(a));
      html.push(disclaimerPage(data));
      return html.join('');
    }

    function disclaimerPage(data) {
      return page(`<h2 class="chapter-title">Avant de lire</h2>
        <p class="disclaimer">
          Ce rapport est établi à partir de calculs d'astrologie védique fondés sur les données de naissance que vous avez fournies.\\n          Il ne constitue en aucun cas un conseil médical, d'investissement ou juridique, et ne saurait servir de fondement à un diagnostic, un traitement, des décisions de transaction ou des jugements juridiques.\\n          Pour toute décision concernant la santé, le patrimoine ou les contrats, veuillez toujours consulter un professionnel qualifié dans le domaine concerné.<br><br>
          Les périodes décrites sont fondées sur les calculs du Vimshottari Dasha et n'indiquent nullement si une date particulière est propice.\\n          Les pierres, les couleurs et les directions sont des suggestions tirées de tables de correspondances classiques et aucun effet n'est garanti.<br><br>
          Émis le : ${esc((data.astro?.generated_at || '').slice(0, 10))}<br>
          &copy; Libertas Jyotish
        </p>`);
    }

    load();
  </script>
</body>
</html>
